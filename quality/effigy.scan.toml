[scan.god_files]
# Poodle's component and renderer files are declarative composition units: a
# line count above 500 is common without implying mixed ownership. Keep 500 as
# the review signal; reserve doctor errors for files beyond the largest current
# cohesive units so the scanner reports growth instead of failing healthy code.
warn = 500
high = 1200
critical = 1600
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = [
  "docs/**", "dist/**", "node_modules/**", "**/assets/**", "**/artifacts/**",
  "**/*.json", "**/preview/**", "**/scripts/**",
  # Complex interactive component shells. Behavioural logic is extracted to
  # @inflatable-cookie/poodle-core / poodle-specs and (for Svelte) CSS is extracted to a
  # co-located .css file; the residual is cohesive markup + machine-wiring +
  # a11y attributes that does not decompose without harming clarity.
  "**/ColorPicker.svelte", "**/Tabs.svelte", "**/RelationPicker.svelte", "**/BlockEditor.svelte", "**/DockRegion.svelte",
  "**/ListCard.svelte", "**/Select.svelte", "**/DataTable.svelte", "**/TextInput.svelte", "**/Tree.svelte",
  "**/FilterBuilder.svelte",
  # React carries the same cohesive component-shell posture. Helpers are local
  # because their state and accessibility wiring are not reusable components.
  "**/ColorPicker.tsx", "**/Tabs.tsx", "**/RelationPicker.tsx", "**/ListCard.tsx",
  "**/Select.tsx", "**/DataTable.tsx", "**/FilterBuilder.tsx",
  # Cohesive single-expression Rust render/compose bodies (logic in poodle-specs/headless;
  # decomposing would require parameter-bag structs that reduce clarity).
  "**/data_table/render.rs", "**/jetstream/components/src/list_card.rs",
  "**/render/src/split_button.rs", "**/render/src/presentation.rs",
  "**/render/src/color_picker.rs", "**/render/src/filter_builder.rs",
  "**/render/src/select.rs", "**/render/src/data_table.rs", "**/render/src/calendar.rs",
  # Renderer-neutral spec modules: public data shape, derived helpers, and
  # contract tests belong together. Their size reflects component semantics,
  # not mixed runtime ownership.
  "**/contracts/components/src/model_picker.rs", "**/contracts/components/src/filter_builder.rs",
  "**/contracts/components/src/agent_chat_input.rs", "**/contracts/components/src/log_list.rs",
  "**/contracts/headless/src/text_input.rs", "**/contracts/headless/tests/conformance.rs",
  # Legacy direct-adapter catalogues. Each file is a flat set of small,
  # backend-owned RenderComponent mappings or one token theme implementation;
  # the manifest drift gate checks their claimed surface independently.
  "**/jetstream/adapter/src/render_composites.rs",
  "**/jetstream/adapter/src/render_feedback.rs",
  "**/jetstream/adapter/src/theme.rs",
  # Type-system aggregation files: interdependent type definitions with no
  # runtime logic; splitting forces arbitrary cross-file type imports for no
  # maintainability gain.
  "**/contracts/**/types.rs", "**/contracts/**/lib.rs", "**/svelte/components/src/types.ts",
  "**/react/components/src/types.ts",
  # Stylesheets: the god-files scanner targets code-complexity, not CSS length.
  # Component styles are cohesive and (for extracted files) already split from
  # their component.
  "**/*.css",
]
format = "markdown"
out = ".effigy/reports/god-files.md"

[scan.attention_markers]
# `note` and `placeholder` are normal UI vocabulary in this repository, not
# deferred-work markers.
warning = ["TODO", "REVIEW"]
high = ["FIXME", "HACK", "workaround"]
critical = ["BUG", "SECURITY", "remove before release"]
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = ["node_modules/**", "**/assets/**"]
format = "markdown"
out = ".effigy/reports/attention-markers.md"

[scan.generated_in_src]
# Generated token mirrors are deliberate package inputs. They live under the
# exported source tree so source-consumed and packed installs resolve the same
# files; drift gates verify them against the canonical token source.
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = ["packages/core/src/tokens/generated/**"]
format = "markdown"
out = ".effigy/reports/generated-in-src.md"

[scan.comment_ratio]
# Contracts and visual-test configuration need explanatory comments around
# non-obvious state transitions and deterministic capture constraints.
warn = 2.0
high = 3.0
critical = 4.0
min_code_lines = 20
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**", "test/**"]
exclude = ["**/assets/**", "**/artifacts/**"]
format = "markdown"
out = ".effigy/reports/comment-ratio.md"

[scan.stale_suppressions]
# Rust `#[expect]` attributes are self-reporting: rustc emits an
# `unfulfilled_lint_expectations` warning once the expected lint disappears.
# Scan silent and tool-specific bypasses instead.
warning = ["@ts-ignore", "@ts-expect-error", "type: ignore", "eslint-disable-next-line"]
high = ["#[allow(", "rubocop:disable", "swiftlint:disable", "prettier-ignore", "stylelint-disable"]
critical = ["nolint", "#[allow(warnings)]", "shellcheck disable=", "eslint-disable", "fmt: off"]
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**", "test/**"]
exclude = ["**/assets/**", "**/artifacts/**"]
format = "markdown"
out = ".effigy/reports/stale-suppressions.md"
