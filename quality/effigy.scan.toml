[scan.god_files]
# Thresholds raised for Svelte primitives (complex interactive components with
# substantial accessibility markup). Composites and contracts remain strict.
warn = 250
high = 500
critical = 900
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = [
  "docs/**", "dist/**", "node_modules/**", "**/assets/**", "**/artifacts/**",
  "**/*.json", "**/preview/**", "**/scripts/**",
  # Complex interactive component shells. Behavioural logic is extracted to
  # @inflatable-cookie/poodle-headless / poodle-specs and (for Svelte) CSS is extracted to a
  # co-located .css file; the residual is cohesive markup + machine-wiring +
  # a11y attributes that does not decompose without harming clarity.
  "**/ColorPicker.svelte", "**/Tabs.svelte", "**/RelationPicker.svelte", "**/BlockEditor.svelte", "**/DockRegion.svelte",
  "**/ListCard.svelte", "**/Select.svelte", "**/DataTable.svelte", "**/TextInput.svelte", "**/Tree.svelte",
  # Cohesive single-expression Rust render/compose bodies (logic in poodle-specs/headless;
  # decomposing would require parameter-bag structs that reduce clarity).
  "**/data_table/render.rs", "**/jetstream/components/src/list_card.rs",
  # Type-system aggregation files: interdependent type definitions with no
  # runtime logic; splitting forces arbitrary cross-file type imports for no
  # maintainability gain.
  "**/contracts/**/types.rs", "**/contracts/**/lib.rs", "**/svelte/components/src/types.ts",
  # Stylesheets: the god-files scanner targets code-complexity, not CSS length.
  # Component styles are cohesive and (for extracted files) already split from
  # their component.
  "**/*.css",
]
format = "markdown"
out = ".effigy/reports/god-files.md"

[scan.attention_markers]
warning = ["TODO", "REVIEW", "NOTE", "placeholder"]
high = ["FIXME", "HACK", "workaround"]
critical = ["BUG", "SECURITY", "remove before release"]
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = ["node_modules/**", "**/assets/**"]
format = "markdown"
out = ".effigy/reports/attention-markers.md"
