[catalog]
alias = "flint"

[bootstrap]
setup = ["bootstrap:deps"]
start = "preview:dev"

[tasks]
"bootstrap:deps" = [
  "bun install",
  "cargo fetch",
]

# Token system
"tokens:build" = "bun packages/tokens/scripts/build-tokens.ts"

# Preview (documentation site)
"svelte:build" = "bun run --cwd packages/svelte/preview build"
"svelte:run" = "bun run --cwd packages/svelte/preview dev"
"svelte:preview" = [{ task = "svelte:run"}]

# GPUI native preview (macOS)
"gpui:build" = "cargo build -p flint-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:run" = "cargo run -p flint-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:test" = "cargo test -p flint-gpui --manifest-path packages/gpui/adapter/Cargo.toml"
"gpui:preview" = [{ task = "gpui:run" }]

# Jetstream native preview (game engine)
"jetstream:build" = "cargo build -p flint-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:run" = "cargo run -p flint-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:test" = "cd packages/jetstream/adapter && cargo test"
"jetstream:preview" = [{ task = "jetstream:run" }]

# Reports
"report:parity" = [
  { task = "tokens:build" },
  { run = "bun run --cwd packages/svelte/preview parity:report" },
]
"report:accessibility" = "bun run --cwd packages/svelte/preview accessibility:report"

# Documentation
"docs:lint" = "bun run --cwd packages/svelte/preview docs:lint"
"docs:dev" = [{ task = "svelte:run" }]
"docs:build" = [{ task = "svelte:build" }]
"docs:check" = [
  { task = "docs:lint" },
  { task = "report:parity" },
  { task = "report:accessibility" },
  { task = "docs:build" },
]

# Legacy aliases for compatibility
"parity:check" = [{ task = "docs:check" }]
"parity:report" = [{ task = "report:parity" }]

# Health check aggregator
health = [{ task = "docs:check" }]

[scan.god_files]
warn = 250
high = 400
critical = 700
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = ["docs/**", "dist/**", "node_modules/**"]
format = "markdown"
out = ".effigy/reports/god-files.md"

[scan.attention_markers]
warning = ["TODO", "REVIEW", "NOTE", "placeholder"]
high = ["FIXME", "HACK", "@deprecated", "workaround"]
critical = ["BUG", "SECURITY", "remove before release"]
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = ["node_modules/**"]
format = "markdown"
out = ".effigy/reports/attention-markers.md"
