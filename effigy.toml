[catalog]
alias = "pug"

[tasks]
# Token system
"tokens:build" = "bun packages/tokens/scripts/build-tokens.ts"

# Preview (documentation site)
"preview:dev" = "bun run --cwd packages/svelte/preview dev"
"preview:build" = "bun run --cwd packages/svelte/preview build"

# GPUI native preview (macOS)
"gpui:build" = "cargo build -p pug-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:run" = "cargo run -p pug-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:test" = "cargo test -p pug-gpui --manifest-path packages/gpui/adapter/Cargo.toml"
"gpui:preview" = [{ task = "gpui:run" }]

# Reports
"report:parity" = [
  { task = "tokens:build" },
  { run = "bun run --cwd packages/svelte/preview parity:report" },
]
"report:accessibility" = "bun run --cwd packages/svelte/preview accessibility:report"

# Documentation
"docs:lint" = "bun run --cwd packages/svelte/preview docs:lint"
"docs:dev" = [{ task = "preview:dev" }]
"docs:build" = [{ task = "preview:build" }]
"docs:check" = [
  { task = "docs:lint" },
  { task = "report:parity" },
  { task = "report:accessibility" },
  { task = "docs:build" },
]

# Legacy aliases for compatibility
"parity:check" = [{ task = "docs:check" }]
"parity:report" = [{ task = "report:parity" }]

# Health check aggregator
health = [{ task = "docs:check" }]

[scan.god_files]
warn = 250
high = 400
critical = 700
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = ["docs/**", "dist/**", "node_modules/**"]
format = "markdown"
out = ".effigy/reports/god-files.md"

[scan.attention_markers]
warning = ["TODO", "REVIEW", "NOTE", "placeholder"]
high = ["FIXME", "HACK", "@deprecated", "workaround"]
critical = ["BUG", "SECURITY", "remove before release"]
doctor = true
fail_on_findings = false
respect_gitignore = true
include = ["packages/**"]
exclude = ["node_modules/**"]
format = "markdown"
out = ".effigy/reports/attention-markers.md"
