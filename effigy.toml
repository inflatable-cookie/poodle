[catalog]
alias = "poodle"

[manifest]
include = [
  "tasks/effigy.tasks.toml",
  "quality/effigy.scan.toml",
  "demos/effigy.demos.toml",
]

[isolation]
paths = [
  "node_modules",
  "packages/svelte/components/node_modules",
  "packages/svelte/icons-lucide/node_modules",
  "packages/svelte/preview/node_modules",
  "packages/svelte/preview/.svelte-kit",
]

[bootstrap]
setup = ["bootstrap:deps"]
start = "preview:dev"
