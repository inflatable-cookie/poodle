# Concepts that no longer exist. The retired-concepts check fails on any listed
# term, path or config key found outside `allow`
# (`effigy skill run northstar/retired-concepts`).
#
# paths and allow: an entry is an exact file, or a directory when it ends in
# "/". `*` matches within one path segment. Keep terms multi-word and specific.

# Published history that is never rewritten; check-links and retired-concepts
# skip it. Current release rules live in docs/knowledge/contracts/release.md.
frozen = [
  "docs/release-notes/",
  # Changelog test inputs whose links are deliberately fixture text.
  "test/package-install/fixtures/",
]

[[retired]]
id = "northstar-process-records"
retired = "2026-09-26"
replacement = "Knowledge in docs/knowledge/; the plan, leads, tasks, briefs, status and outcomes live in Queue."
owner = "docs/knowledge/README.md"
terms = [
  "roadmap card",
  "generation index",
  "generation runway",
  "active generation",
  "Northstar task",
  "northstar:lifecycle",
  "chatterbox handoff",
]
paths = [
  ".northstar/lifecycle/",
  "docs/roadmaps/",
  "docs/handoffs/",
  "docs/logs/",
  "docs/archive/",
]
config_keys = ["northstar/queue:hook", "paseo.queue.control.v4"]
allow = [
  "CHANGELOG.md",
  ".agents/skills/",
  "docs/evidence/nucleus/v1-cohort-bundle/",
  "docs/evidence/visual/g15-047-button-comparison/",
  "docs/knowledge/specs/archive/",
  # Historical closed-candidate release policies match exact past diffs.
  "test/package-install/scope.ts",
]

[[retired]]
id = "papercuts-file"
retired = "2026-09-26"
replacement = "Papercuts are filed in Queue with papercut.add; the planner promotes or closes them."
owner = "docs/knowledge/contracts/working-rules.md"
paths = ["PAPERCUTS.md"]
allow = [
  "CHANGELOG.md",
  ".agents/skills/",
  # Historical g16.059 certification allowlist and its planted fixtures.
  "test/package-install/scope.ts",
  "test/package-install/scope.test.ts",
]

[[retired]]
id = "repository-planning-files"
retired = "2026-09-27"
replacement = "The plan is Queue lanes, lane documents and plan order; leads are Queue records (lead.add)."
owner = "docs/knowledge/README.md"
paths = ["docs/plan.md", "docs/triage/"]
allow = ["CHANGELOG.md"]

[[retired]]
id = "nucleus-receipt-source-pin"
retired = "2026-09-29"
replacement = "Nucleus receipts are frozen history for the archived Nucleus and no longer pin runtime source. See docs/knowledge/vision.md#direction. Native web-only features wait on lane:native-admission, not a receipt rewrite."
owner = "docs/knowledge/vision.md"
terms = [
  "evidence repin",
  "Nucleus evidence repin",
  "pinned-source-paths",
  "SOURCE_PATHS",
  "currentSourceMatchesReceipt",
  "pinned by Nucleus receipts",
]
config_keys = ["SOURCE_PATHS"]
allow = ["CHANGELOG.md"]
