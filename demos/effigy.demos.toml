# Demo tasks. Effigy v0.15 removed the demo system, so these are ordinary
# tasks: `effigy demo:<name>` replaces `effigy demo run <name>`. Each delegates
# to the preview selector it has always run; the preview scripts own whatever
# they write, so these tasks name no receipt or artifact path of their own.

[tasks]
# Svelte Documentation Site: starts the SvelteKit design system documentation
# and component preview site (interactive; covers poodle.design-system,
# poodle.svelte-target).
"demo:svelte" = [{ task = "svelte:preview" }]

# GPUI Native Preview: launches the native macOS GPUI preview application for
# the design system (interactive; covers poodle.design-system,
# poodle.gpui-target).
"demo:gpui" = [{ task = "gpui:preview" }]

# Jetstream Game Engine Preview: launches the Jetstream game engine preview
# application for the design system (interactive; covers poodle.design-system,
# poodle.jetstream-target).
"demo:jetstream" = [{ task = "jetstream:preview" }]
