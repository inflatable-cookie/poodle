[package]
name = "flint-jetstream-preview"
version = "0.0.0"
edition = "2024"
description = "Jetstream preview application for the Flint design system — showcases all Flint components rendered via the Jetstream game engine."

[[bin]]
name = "flint-jetstream-preview"
path = "src/main.rs"

[dependencies]
# Flint adapter + contracts + components
flint-jetstream = { path = "../adapter" }
flint-jetstream-components = { path = "../components" }
flint-adapter = { path = "../../contracts/adapter" }
flint-primitives = { path = "../../contracts/primitives" }
flint-composites = { path = "../../contracts/composites" }
flint-workstation = { path = "../../contracts/workstation" }
flint-layout = { path = "../../contracts/layout" }
flint-style = { path = "../../contracts/style" }
flint-tokens = { path = "../../contracts/tokens" }

# Jetstream runtime (cross-repo path)
jetstream-runtime = { path = "../../../../jetstream/crates/jetstream-runtime" }
jetstream-renderer = { path = "../../../../jetstream/crates/jetstream-renderer" }
jetstream-platform = { path = "../../../../jetstream/crates/jetstream-platform" }
jetstream-input = { path = "../../../../jetstream/crates/jetstream-input" }
jetstream-text = { path = "../../../../jetstream/crates/jetstream-text" }

glam = "0.29"
wgpu = "24"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = "0.11"
log = "0.4"

[package.metadata.flint]
public-intent = true
channel = "preview"
stability = "pre-release"
