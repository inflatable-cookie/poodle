[package]
name = "poodle-jetstream-preview"
version = "0.2.2"
edition = "2024"
license = "MIT"
rust-version = "1.95"
default-run = "poodle-jetstream-preview"
description = "Jetstream preview application for the Poodle design system — showcases all Poodle components rendered via the Jetstream game engine."
publish = false

[[bin]]
name = "poodle-jetstream-preview"
path = "src/main.rs"

[dependencies]
# Poodle adapter + contracts + components
poodle-jetstream = { path = "../adapter" }
poodle-node = { path = "../../contracts/node" }
poodle-render = { path = "../../render" }
jetstream-poodle = { path = "../../../../jetstream/crates/jetstream-poodle" }
poodle-adapter = { path = "../../contracts/adapter" }
poodle-specs = { path = "../../contracts/components" }
poodle-headless = { path = "../../contracts/headless" }
poodle-layout = { path = "../../contracts/layout" }
poodle-style = { path = "../../contracts/style" }
poodle-tokens = { path = "../../contracts/tokens" }

# Jetstream runtime (cross-repo path)
jetstream-ui = { path = "../../../../jetstream/crates/jetstream-ui" }
jetstream-renderer = { path = "../../../../jetstream/crates/jetstream-renderer" }
jetstream-platform = { path = "../../../../jetstream/crates/jetstream-platform" }
jetstream-input = { path = "../../../../jetstream/crates/jetstream-input" }
jetstream-text = { path = "../../../../jetstream/crates/jetstream-text" }

# These runtime types must track the sibling Jetstream workspace exactly.
# Duplicate versions resolve, then fail at call sites as distinct Rust types.
glam = "0.29"
# Must track the sibling jetstream workspace exactly. Two wgpu versions in one
# graph do not conflict at resolve time — they fail at the call site, with every
# argument reported as "expected wgpu::Device, found wgpu::Device".
wgpu = "30"
pollster = "0.4"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = "0.11"
log = "0.4"

[package.metadata.poodle]
public-intent = false
channel = "internal"
stability = "internal-tooling"
