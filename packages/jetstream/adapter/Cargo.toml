[package]
name = "poodle-jetstream"
version = "0.4.15"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Poodle theme and accessibility mappings for the Jetstream node backend."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "renderer", "ui"]
publish = false

[dependencies]
poodle-adapter = { version = "0.4.15", path = "../../contracts/adapter" }
poodle-headless = { version = "0.4.15", path = "../../contracts/headless" }
poodle-tokens = { version = "0.4.15", path = "../../contracts/tokens" }
poodle-node = { version = "0.4.15", path = "../../contracts/node" }
# Linear colors cross the preview's Jetstream boundary as Vec4.
glam = "0.29"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
