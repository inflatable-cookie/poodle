[package]
name = "poodle-jetstream"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Jetstream rendering adapter for Poodle — maps shared contract specs and resolved styles to Jetstream UiTree nodes."

[dependencies]
poodle-adapter = { path = "../../contracts/adapter" }
poodle-headless = { path = "../../contracts/headless" }
poodle-events = { path = "../../contracts/events" }
poodle-layout = { path = "../../contracts/layout" }
poodle-specs = { path = "../../contracts/components" }
poodle-style = { path = "../../contracts/style" }
poodle-tokens = { path = "../../contracts/tokens" }
taffy = "0.9"
glam = "0.29"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
