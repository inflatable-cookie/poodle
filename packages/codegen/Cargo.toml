[package]
name = "poodle-codegen"
version = "0.2.3"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Deterministic emitter turning validated poodle IR into committed TypeScript artifacts."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "poodle-codegen"
path = "src/bin/poodle-codegen.rs"

[dependencies]
poodle-ir = { version = "0.2.3", path = "../contracts/ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test oracle only: validates emitted JSON-surface documents against the
# emitted JSON Schema. Not a type-mirroring emitter (ruling R4 — ts-rs,
# schemars, typeshare, specta stay out); it renders nothing, the crate's
# dependency posture is unchanged.
[dev-dependencies]
jsonschema = "0.33"

[package.metadata.poodle]
public-intent = false
channel = "internal"
stability = "internal-tooling"
