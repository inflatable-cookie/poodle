[package]
name = "poodle-headless"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Poodle headless behavior core, Rust mirror: pure component state machines and shared interaction logic, conformance-tested against the TypeScript core."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "headless", "state-machine", "ui"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
