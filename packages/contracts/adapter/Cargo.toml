[package]
name = "flint-adapter"
version = "0.0.0"
edition = "2021"
description = "Renderer adapter traits for Flint multi-renderer targets."

[lib]
path = "src/lib.rs"

[dependencies]
flint-events = { path = "../events" }
flint-layout = { path = "../layout" }
flint-style = { path = "../style" }
flint-tokens = { path = "../tokens" }

[package.metadata.flint]
public-intent = true
channel = "preview"
stability = "pre-release"
