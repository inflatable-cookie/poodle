[package]
name = "poodle-adapter"
version = "0.0.0"
edition = "2021"
description = "Renderer adapter traits for Poodle multi-renderer targets."

[lib]
path = "src/lib.rs"

[dependencies]
poodle-events = { path = "../events" }
poodle-layout = { path = "../layout" }
poodle-style = { path = "../style" }
poodle-tokens = { path = "../tokens" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
