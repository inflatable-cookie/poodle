[package]
name = "poodle-adapter"
version = "0.2.2"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Renderer adapter traits for Poodle multi-renderer targets."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "renderer", "ui"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
poodle-events = { version = "0.2.2", path = "../events" }
poodle-layout = { version = "0.2.2", path = "../layout" }
poodle-style = { version = "0.2.2", path = "../style" }
poodle-tokens = { version = "0.2.2", path = "../tokens" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
