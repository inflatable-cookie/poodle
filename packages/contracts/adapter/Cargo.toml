[package]
name = "pug-adapter"
version = "0.0.0"
edition = "2021"
description = "Renderer adapter traits for Pug multi-renderer targets."

[lib]
path = "src/lib.rs"

[dependencies]
pug-events = { path = "../events" }
pug-layout = { path = "../layout" }
pug-style = { path = "../style" }
pug-tokens = { path = "../tokens" }

[package.metadata.pug]
public-intent = true
channel = "preview"
stability = "pre-release"
