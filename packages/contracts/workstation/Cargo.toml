[package]
name = "flint-workstation"
version = "0.0.0"
edition = "2021"
description = "Contract-backed workstation specs for Flint multi-renderer targets."

[lib]
path = "src/lib.rs"

[dependencies]
flint-composites = { path = "../composites" }
flint-primitives = { path = "../primitives" }
flint-tokens = { path = "../tokens" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.flint]
public-intent = true
channel = "preview"
stability = "pre-release"
