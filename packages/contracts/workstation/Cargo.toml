[package]
name = "poodle-workstation"
version = "0.0.0"
edition = "2021"
description = "Contract-backed workstation specs for Poodle multi-renderer targets."

[lib]
path = "src/lib.rs"

[dependencies]
poodle-composites = { path = "../composites" }
poodle-primitives = { path = "../primitives" }
poodle-tokens = { path = "../tokens" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
