[package]
name = "pug-workstation"
version = "0.0.0"
edition = "2021"
description = "Contract-backed workstation specs for Pug multi-renderer targets."

[lib]
path = "src/lib.rs"

[dependencies]
pug-composites = { path = "../composites" }
pug-primitives = { path = "../primitives" }
pug-tokens = { path = "../tokens" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.pug]
public-intent = true
channel = "preview"
stability = "pre-release"
