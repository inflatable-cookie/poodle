[package]
name = "poodle-style"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Resolved style descriptor IR for Poodle multi-renderer targets."

[lib]
path = "src/lib.rs"

[dependencies]
poodle-tokens = { path = "../tokens" }
poodle-layout = { path = "../layout" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
