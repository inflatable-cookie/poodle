[package]
name = "poodle-markdown"
version = "0.2.3"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Poodle shared markdown block model: normalises pulldown-cmark into the same blocks the web target derives from marked, so every renderer shows the same document."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "markdown", "ui"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
serde_json = "1"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
