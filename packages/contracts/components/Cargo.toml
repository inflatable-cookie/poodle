[package]
name = "poodle-specs"
version = "0.2.3"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Contract-backed component specs for Poodle multi-renderer targets."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["components", "design-system", "ui"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
poodle-tokens = { version = "0.2.3", path = "../tokens" }
poodle-headless = { version = "0.2.3", path = "../headless" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
