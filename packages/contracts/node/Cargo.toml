[package]
name = "poodle-node"
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Poodle's render vocabulary — the node tree components emit and backends interpret."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "render-tree", "ui"]
publish = false

[dependencies]
# The drag-and-drop registration vocabulary re-exports the shared semantic
# kernel's own types (`DragSubject`, `DropIntent`, `DropPosition`, terminal
# outcome) rather than mirroring them. `poodle-headless` is pure — no gpui, no
# engine, no renderer — so this stays a contracts-to-contracts edge.
poodle-headless = { version = "0.3.0", path = "../headless" }
poodle-layout = { version = "0.3.0", path = "../layout" }
poodle-style = { version = "0.3.0", path = "../style" }
poodle-tokens = { version = "0.3.0", path = "../tokens" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
