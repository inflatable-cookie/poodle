[package]
name = "poodle-ir"
version = "0.2.2"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Versioned Rust-authored component and scene IR for Poodle multi-renderer targets."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "ir", "ui"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
poodle-tokens = { version = "0.2.2", path = "../tokens" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
