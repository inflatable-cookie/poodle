[package]
name = "poodle-gpui"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "GPUI rendering adapter for Poodle — maps shared contract specs and resolved styles to GPUI native elements."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "gpui", "ui"]

[lib]
path = "src/lib.rs"

[dependencies]
poodle-adapter = { version = "0.1.0", path = "../../contracts/adapter" }
poodle-headless = { version = "0.1.0", path = "../../contracts/headless" }
poodle-events = { version = "0.1.0", path = "../../contracts/events" }
poodle-layout = { version = "0.1.0", path = "../../contracts/layout" }
poodle-specs = { version = "0.1.0", path = "../../contracts/components" }
poodle-style = { version = "0.1.0", path = "../../contracts/style" }
poodle-tokens = { version = "0.1.0", path = "../../contracts/tokens" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
