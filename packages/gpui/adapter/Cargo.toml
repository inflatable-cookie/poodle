[package]
name = "flint-gpui"
version = "0.0.0"
edition = "2021"
description = "GPUI rendering adapter for Flint — maps shared contract specs and resolved styles to GPUI native elements."

[lib]
path = "src/lib.rs"

[dependencies]
flint-adapter = { path = "../../contracts/adapter" }
flint-events = { path = "../../contracts/events" }
flint-layout = { path = "../../contracts/layout" }
flint-primitives = { path = "../../contracts/primitives" }
flint-composites = { path = "../../contracts/composites" }
flint-workstation = { path = "../../contracts/workstation" }
flint-style = { path = "../../contracts/style" }
flint-tokens = { path = "../../contracts/tokens" }

[package.metadata.flint]
public-intent = true
channel = "preview"
stability = "pre-release"
