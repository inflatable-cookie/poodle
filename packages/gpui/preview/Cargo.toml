[package]
name = "poodle-gpui-preview"
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Native macOS preview application for the Poodle design system, rendered via GPUI."
publish = false

[[bin]]
name = "poodle-preview"
path = "src/main.rs"

# g16.005 window capture target. `required-features` keeps it out of every
# ordinary build: `cargo build --bin poodle-preview` never sees it, and no
# default, CI, qa, or release path builds or runs it. It opens a real macOS
# window and needs Screen Recording permission, which is why its Effigy
# selector carries the `-windowed` suffix.
[[bin]]
name = "poodle-window-capture"
path = "src/bin/window_capture.rs"
required-features = ["window-capture"]

[features]
# Window capture needs the receipt's content hash and the frontmost-application
# monitor that proves the run took no focus. It does NOT need `test-support`:
# the transport uses a real GPUI window, not the in-memory test platform, so
# the fork-era coupling between capture and test-only APIs is gone.
window-capture = [
    "dep:sha2",
    "dep:raw-window-handle",
    "objc2-app-kit/NSWorkspace",
    "objc2-app-kit/NSRunningApplication",
    "objc2-app-kit/NSView",
]

[dependencies]
# GPUI framework — the published crates.io release, matching the node
# backend's public source. `Application::new()` is the framework's own
# constructor here; there is no separate platform crate to depend on.
gpui = "0.2.2"

# Poodle adapter + contracts + real components
poodle-gpui = { path = "../adapter" }
poodle-gpui-node-backend = { path = "../node-backend" }
poodle-render = { path = "../../render", features = ["icon-geometry-internal"] }
poodle-node = { path = "../../contracts/node" }
poodle-adapter = { path = "../../contracts/adapter" }
poodle-specs = { path = "../../contracts/components" }
poodle-headless = { path = "../../contracts/headless" }
poodle-style = { path = "../../contracts/style" }
poodle-tokens = { path = "../../contracts/tokens" }
anyhow = "1"


# The interactive preview app posts real NSEvents to its own window through
# the AppKit queue (preview click/key drive — not the conformance path).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSGraphicsContext",
    "NSApplication",
    "NSWindow",
    "NSResponder",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Window capture only: the receipt's content hash. Already in the graph as a
# transitive crate; optional so the ordinary preview binary never links it.
# The captured PNG is published exactly as the window server wrote it, so no
# image codec is needed — only the IHDR header is read.
sha2 = { version = "0.10", optional = true }
# Window capture only: obtain the exact AppKit window backing the GPUI
# `Window`, so a batch never mistakes a just-closed sibling window for the
# current scene.
raw-window-handle = { version = "0.6", optional = true }
# The completion-driven file pick (g15.007) awaits the OS prompt's oneshot
# receiver in a task. Already in the graph as gpui's own dependency.
futures = "0.3"

# The preview rebuilds sizeable GPUI element trees while interacting. Keep
# debug assertions and incremental compilation, but optimize the runtime path
# enough for frame pacing to match the release build.
[profile.dev]
opt-level = 3

[package.metadata.poodle]
public-intent = false
channel = "internal"
stability = "internal-tooling"

[[test]]
name = "catalogue"
path = "tests/catalogue.rs"

[[test]]
name = "headless_regressions"
path = "tests/headless_regressions.rs"

[[test]]
name = "icon_geometry_headless"
path = "tests/icon_geometry_headless.rs"

# g15.046 Button visual fixture inventory. Data parsing only: this target
# renders nothing, opens no window, and captures no pixels. It lives here
# because GPUI is the runtime that consumes the inventory in g15.047, and it
# validates theme / control-size names against the same `presentation_axes`
# domain the offscreen capture target parses its CLI against.
[[test]]
name = "visual_fixture_inventory"
path = "tests/visual_fixture_inventory.rs"

# The focused native regressions run through GPUI's in-memory test platform
# (TestAppContext / VisualTestContext / TestWindow). test-support is a
# dev-dependency so ordinary builds and the preview bin never pull it in.
[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
