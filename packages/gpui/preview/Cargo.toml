[package]
name = "poodle-gpui-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native macOS preview application for the Poodle design system, rendered via GPUI."

[[bin]]
name = "poodle-preview"
path = "src/main.rs"

[dependencies]
# GPUI framework — Zed's GPU-accelerated UI framework (macOS/Metal)
# Using crates.io release. If build fails due to core-foundation/font-kit
# conflicts, switch to git: gpui = { git = "https://github.com/zed-industries/zed" }
gpui = "0.2.2"

# Poodle adapter + contracts + real components
poodle-gpui = { path = "../adapter" }
poodle-gpui-node-backend = { path = "../node-backend" }
poodle-render = { path = "../../render" }
poodle-node = { path = "../../contracts/node" }
poodle-adapter = { path = "../../contracts/adapter" }
poodle-specs = { path = "../../contracts/components" }
poodle-headless = { path = "../../contracts/headless" }
poodle-style = { path = "../../contracts/style" }
poodle-tokens = { path = "../../contracts/tokens" }
anyhow = "1"

# The click driver builds NSEvents in-process and sends them to our own
# NSWindow — Window::dispatch_event returns a crate-private type, so gpui's
# own event entry point cannot be called from here.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSGraphicsContext",
    "NSApplication",
    "NSWindow",
    "NSResponder",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
