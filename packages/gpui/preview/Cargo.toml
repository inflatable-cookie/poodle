[package]
name = "poodle-gpui-preview"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Native macOS preview application for the Poodle design system, rendered via GPUI."
publish = false

[[bin]]
name = "poodle-preview"
path = "src/main.rs"

# g15.045 offscreen capture smoke target. `required-features` keeps it out of
# every ordinary build: an ordinary `cargo build --bin poodle-preview` never
# sees it, and the `capture` feature below is the only place the shipping
# graph's `test-support` can be switched on outside dev tests.
[[bin]]
name = "poodle-offscreen-capture"
path = "src/bin/offscreen_capture.rs"
required-features = ["capture"]

[features]
# Offscreen capture needs GPUI's `test-support` (render_to_image and the
# headless renderer factory are `cfg(test-support)` upstream). Test-only
# dependencies (proptest, leak-detection) ride along, which is exactly why
# this is a required feature of the capture binary and never a default.
capture = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "dep:image",
    "dep:sha2",
]

[dependencies]
# GPUI framework — Zed's GPU-accelerated UI framework (macOS/Metal), pinned to
# the immutable revision adopted by g15.045 (offscreen capture seam). The
# offscreen readback capability is git-only; no registry release carries it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1ea16c1ab9dd6d36649e002dc60995634da04daf" }
# Application construction moved to the platform crate at the adopted
# revision (`gpui_platform::application()` replaces `Application::new()`).
# `font-kit` is required: without it the macOS platform silently has no real
# text rendering. test-support stays out of this normal dependency — it is
# enabled only by dev tests and the dedicated capture target below.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1ea16c1ab9dd6d36649e002dc60995634da04daf", features = ["font-kit"] }

# Poodle adapter + contracts + real components
poodle-gpui = { path = "../adapter" }
poodle-gpui-node-backend = { path = "../node-backend" }
poodle-render = { path = "../../render" }
poodle-node = { path = "../../contracts/node" }
poodle-adapter = { path = "../../contracts/adapter" }
poodle-specs = { path = "../../contracts/components" }
poodle-headless = { path = "../../contracts/headless" }
poodle-style = { path = "../../contracts/style" }
poodle-tokens = { path = "../../contracts/tokens" }
anyhow = "1"

# Offscreen capture only (the `capture` feature): PNG encoding and the
# receipt's content hash. Both already sit in the graph as transitive crates;
# they stay optional so the ordinary preview binary never links them.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
sha2 = { version = "0.10", optional = true }

# The interactive preview app posts real NSEvents to its own window through
# the AppKit queue (preview click/key drive — not the conformance path).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSGraphicsContext",
    "NSApplication",
    "NSWindow",
    "NSResponder",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The completion-driven file pick (g15.007) awaits the OS prompt's oneshot
# receiver in a task. Already in the graph as gpui's own dependency.
futures = "0.3"

# The preview rebuilds sizeable GPUI element trees while interacting. Keep
# debug assertions and incremental compilation, but optimize the runtime path
# enough for frame pacing to match the release build.
[profile.dev]
opt-level = 3

[package.metadata.poodle]
public-intent = false
channel = "internal"
stability = "internal-tooling"

[[test]]
name = "catalogue"
path = "tests/catalogue.rs"

[[test]]
name = "headless_regressions"
path = "tests/headless_regressions.rs"

# g15.046 Button visual fixture inventory. Data parsing only: this target
# renders nothing, opens no window, and captures no pixels. It lives here
# because GPUI is the runtime that consumes the inventory in g15.047, and it
# validates theme / control-size names against the same `presentation_axes`
# domain the offscreen capture target parses its CLI against.
[[test]]
name = "visual_fixture_inventory"
path = "tests/visual_fixture_inventory.rs"

# The focused native regressions run through GPUI's in-memory test platform
# (TestAppContext / VisualTestContext / TestWindow). test-support is a
# dev-dependency so ordinary builds and the preview bin never pull it in.
[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1ea16c1ab9dd6d36649e002dc60995634da04daf", features = ["test-support"] }
