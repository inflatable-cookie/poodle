[package]
name = "flint-gpui-preview"
version = "0.0.0"
edition = "2021"
description = "Native macOS preview application for the Flint design system, rendered via GPUI."

[[bin]]
name = "flint-preview"
path = "src/main.rs"

[dependencies]
# GPUI framework — Zed's GPU-accelerated UI framework (macOS/Metal)
# Using crates.io release. If build fails due to core-foundation/font-kit
# conflicts, switch to git: gpui = { git = "https://github.com/zed-industries/zed" }
gpui = "0.2.2"

# Flint adapter + contracts + real components
flint-gpui = { path = "../adapter" }
flint-gpui-components = { path = "../components" }
flint-adapter = { path = "../../contracts/adapter" }
flint-primitives = { path = "../../contracts/primitives" }
flint-composites = { path = "../../contracts/composites" }
flint-workstation = { path = "../../contracts/workstation" }
flint-style = { path = "../../contracts/style" }
flint-tokens = { path = "../../contracts/tokens" }
anyhow = "1"

[package.metadata.flint]
public-intent = true
channel = "preview"
stability = "pre-release"
