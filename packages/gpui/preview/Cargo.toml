[package]
name = "poodle-gpui-preview"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Native macOS preview application for the Poodle design system, rendered via GPUI."
publish = false

[[bin]]
name = "poodle-preview"
path = "src/main.rs"

[dependencies]
# GPUI framework — Zed's GPU-accelerated UI framework (macOS/Metal)
# Using crates.io release. If build fails due to core-foundation/font-kit
# conflicts, switch to git: gpui = { git = "https://github.com/zed-industries/zed" }
gpui = "0.2.2"

# Poodle adapter + contracts + real components
poodle-gpui = { path = "../adapter" }
poodle-gpui-node-backend = { path = "../node-backend" }
poodle-render = { path = "../../render" }
poodle-node = { path = "../../contracts/node" }
poodle-adapter = { path = "../../contracts/adapter" }
poodle-specs = { path = "../../contracts/components" }
poodle-headless = { path = "../../contracts/headless" }
poodle-style = { path = "../../contracts/style" }
poodle-tokens = { path = "../../contracts/tokens" }
anyhow = "1"

# The interactive preview app posts real NSEvents to its own window through
# the AppKit queue (preview click/key drive — not the conformance path).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSGraphicsContext",
    "NSApplication",
    "NSWindow",
    "NSResponder",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The preview rebuilds sizeable GPUI element trees while interacting. Keep
# debug assertions and incremental compilation, but optimize the runtime path
# enough for frame pacing to match the release build.
[profile.dev]
opt-level = 3

[package.metadata.poodle]
public-intent = false
channel = "internal"
stability = "internal-tooling"

[[test]]
name = "catalogue"
path = "tests/catalogue.rs"

[[test]]
name = "headless_regressions"
path = "tests/headless_regressions.rs"

# The focused native regressions run through GPUI's in-memory test platform
# (TestAppContext / VisualTestContext / TestWindow). test-support is a
# dev-dependency so ordinary builds and the preview bin never pull it in.
[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
