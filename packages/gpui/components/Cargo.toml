[package]
name = "poodle-gpui-components"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Real GPUI renderable components for Poodle — contract-backed, token-resolved, interactive."

[lib]
path = "src/lib.rs"

[dependencies]
gpui = "0.2.2"
poodle-specs = { path = "../../contracts/components" }
poodle-headless = { path = "../../contracts/headless" }
poodle-markdown = { path = "../../contracts/markdown" }
poodle-gpui = { path = "../adapter" }
poodle-adapter = { path = "../../contracts/adapter" }
poodle-tokens = { path = "../../contracts/tokens" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
