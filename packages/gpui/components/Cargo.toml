[package]
name = "poodle-gpui-components"
version = "0.0.0"
edition = "2021"
description = "Real GPUI renderable components for Poodle — contract-backed, token-resolved, interactive."

[lib]
path = "src/lib.rs"

[dependencies]
gpui = "0.2.2"
poodle-primitives = { path = "../../contracts/primitives" }
poodle-composites = { path = "../../contracts/composites" }
poodle-gpui = { path = "../adapter" }
poodle-adapter = { path = "../../contracts/adapter" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
