[package]
name = "flint-gpui-components"
version = "0.0.0"
edition = "2021"
description = "Real GPUI renderable components for Flint — contract-backed, token-resolved, interactive."

[lib]
path = "src/lib.rs"

[dependencies]
gpui = "0.2.2"
flint-primitives = { path = "../../contracts/primitives" }
flint-composites = { path = "../../contracts/composites" }
flint-gpui = { path = "../adapter" }
flint-adapter = { path = "../../contracts/adapter" }

[package.metadata.flint]
public-intent = true
channel = "preview"
stability = "pre-release"
