[package]
name = "poodle-gpui-node-backend"
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "GPUI backend for the Poodle render vocabulary: interprets poodle-node trees as GPUI elements."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["design-system", "gpui", "renderer", "ui"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# GPUI framework — the published crates.io release. This is a public-intent
# package: a consumer that also depends on crates.io `gpui` must receive the
# SAME crate identity, so this source is never a Git fork, patch, or override
# (g16.005). Optional visual tooling does not get to choose it.
gpui = "0.2.2"
poodle-node = { version = "0.3.0", path = "../../contracts/node" }
# Undo coalescing only. The backend owns the history *storage* because history
# is ephemeral per-field UI state and only the backend persists anything across
# frames — but what counts as one undoable step is a text-editing rule, and a
# rule duplicated per backend is the drift this layer exists to prevent.
# `poodle-headless` is pure (no gpui, no engine), so this stays a contracts
# dependency rather than a widening of the interpreter's surface.
poodle-headless = { version = "0.3.0", path = "../../contracts/headless" }
# The single-file pick capability (g15.007) holds the OS prompt's oneshot
# receiver — the type `App::prompt_for_paths` hands back. Already resolved in
# the graph as gpui's own dependency; named here to store the receiver.
futures = "0.3"
anyhow = "1"
# Compile-shape guard (g16.092), not a code dependency. tinyvec reaches this
# graph through gpui (usvg → fontdb and friends) and release 1.13.0 broke its
# alloc-only build: `with_initial_len` calls `vec!` where only
# `alloc::vec::{self, Vec}` is imported — the module, not the macro — and the
# crate is `no_std` without its `std` feature. A fresh downstream consumer has
# no lockfile to fall back on, so its resolution stopped compiling. Naming the
# dependency here enables `std` graph-wide through feature unification while
# the consumer gate keeps resolving current releases.
tinyvec = { version = "1", features = ["std"] }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"
