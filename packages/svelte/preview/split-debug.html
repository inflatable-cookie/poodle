<!doctype html>
<html lang="en" data-theme="cobalt" data-density="compact" data-control-size="sm">
  <head>
    <meta charset="UTF-8" />
    <title>split debug</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #host { height: 100vh; display: flex; }
    </style>
    <script type="module">
      import "../../styles/src/split-view.css";
      window.report = () => {
        return [...document.querySelectorAll(".poodle-split-view")].map((s) => {
          const sr = s.getBoundingClientRect();
          const d = s.querySelector(":scope > .poodle-split-view__divider");
          const dr = d?.getBoundingClientRect();
          const t = s.querySelector(":scope > .poodle-split-view__divider .poodle-split-view__toggles");
          const tr = t?.getBoundingClientRect();
          return {
            id: s.id,
            orientation: s.dataset.orientation,
            split: { x: Math.round(sr.x), y: Math.round(sr.y), w: Math.round(sr.width), h: Math.round(sr.height) },
            divider: dr ? { x: Math.round(dr.x), y: Math.round(dr.y), w: Math.round(dr.width), h: Math.round(dr.height) } : null,
            toggles: tr ? { x: Math.round(tr.x), y: Math.round(tr.y), w: Math.round(tr.width), h: Math.round(tr.height), left: getComputedStyle(t).left, transform: getComputedStyle(t).transform } : null,
          };
        });
      };
    </script>
  </head>
  <body>
    <div id="host">
      <!-- outer: left-center (horizontal) -->
      <div class="poodle-split-view" id="outer" data-orientation="horizontal" style="width: 100%; height: 100%">
        <div class="poodle-split-view__pane" style="flex: 0 0 22%; overflow: hidden; background:#161616">sidebar</div>
        <div class="poodle-split-view__divider" data-orientation="horizontal"></div>
        <div class="poodle-split-view__pane" style="flex: 1 1 0; overflow: hidden">
          <!-- center-right (horizontal) -->
          <div class="poodle-split-view" id="center-right" data-orientation="horizontal" style="width: 100%; height: 100%">
            <div class="poodle-split-view__pane" style="flex: 0 0 80%; overflow: hidden">
              <!-- center-stack (vertical) -->
              <div class="poodle-split-view" id="center-stack" data-orientation="vertical" style="width: 100%; height: 100%">
                <div class="poodle-split-view__pane" style="flex: 0 0 75%; overflow: hidden; background:#1a1a1a">chat</div>
                <div class="poodle-split-view__divider" data-orientation="vertical">
                  <div class="poodle-split-view__toggles"><button type="button">v</button></div>
                </div>
                <div class="poodle-split-view__pane" style="flex: 1 1 0; overflow: hidden; background:#141414">terminal</div>
              </div>
            </div>
            <div class="poodle-split-view__divider" data-orientation="horizontal"></div>
            <div class="poodle-split-view__pane" style="flex: 1 1 0; overflow: hidden">
              <!-- right-stack (vertical), BOTH panes collapsed -->
              <div class="poodle-split-view" id="right-stack" data-orientation="vertical" data-primary-collapsed data-secondary-collapsed style="width: 100%; height: 100%">
                <div class="poodle-split-view__pane" style="flex: 0 0 0; overflow: hidden"></div>
                <div class="poodle-split-view__divider" data-orientation="vertical">
                  <div class="poodle-split-view__toggles"><button type="button">^</button><button type="button">v</button></div>
                </div>
                <div class="poodle-split-view__pane" style="flex: 0 0 0; overflow: hidden"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
