<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>split debug</title>
    <style>html, body { margin: 0; height: 100%; background: #111; }</style>
    <script type="module">
      import "../../styles/src/split-view.css";
      window.report = () => {
        const s = document.getElementById("stack");
        const t = s.querySelector(":scope > .poodle-split-view__toggles");
        const cs = getComputedStyle(t);
        return {
          attr: s.getAttribute("data-toggle-visibility"),
          opacity: cs.opacity,
          reveal: cs.getPropertyValue("--poodle-split-toggles-reveal").trim(),
        };
      };
    </script>
  </head>
  <body>
    <div
      class="poodle-split-view"
      id="stack"
      data-orientation="vertical"
      data-toggle-visibility="hover"
      style="width: 100%; height: 100vh; --poodle-split-seam: 75%"
    >
      <div class="poodle-split-view__pane" style="flex: 0 0 75%; overflow: hidden">top</div>
      <div class="poodle-split-view__divider" data-orientation="vertical"></div>
      <div class="poodle-split-view__pane" style="flex: 1 1 0; overflow: hidden">bottom</div>
      <div class="poodle-split-view__toggles"><button type="button">v</button></div>
    </div>
  </body>
</html>
