[package]
name = "poodle-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "The single Rust component implementation: Spec + Theme -> poodle-node trees, interpreted by per-backend adapters."
repository = "https://github.com/inflatable-cookie/poodle"
homepage = "https://github.com/inflatable-cookie/poodle"
readme = "README.md"
keywords = ["components", "design-system", "renderer", "ui"]
publish = false

[dependencies]
poodle-node = { version = "0.1.0", path = "../contracts/node" }
poodle-adapter = { version = "0.1.0", path = "../contracts/adapter" }
poodle-specs = { version = "0.1.0", path = "../contracts/components" }
poodle-headless = { version = "0.1.0", path = "../contracts/headless" }
poodle-markdown = { version = "0.1.0", path = "../contracts/markdown" }
poodle-tokens = { version = "0.1.0", path = "../contracts/tokens" }
poodle-layout = { version = "0.1.0", path = "../contracts/layout" }
poodle-style = { version = "0.1.0", path = "../contracts/style" }
# Local civil time for the LicenceStatus quiet `inGrace` line (g15.007): the
# web formats it in the user's timezone, so the renderer resolves the instant
# through the platform's `localtime` on Unix. Already in the graph as gpui's
# own dependency; the non-Unix fallback stays UTC.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"

# Token resolution for tests. Pure contracts despite the name (verified: no
# jetstream dependency); the resolver logically belongs in contracts and its
# relocation is part of the migration.
[dev-dependencies]
poodle-jetstream = { version = "0.1.0", path = "../jetstream/adapter" }
