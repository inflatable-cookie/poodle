[package]
name = "poodle-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "The single Rust component implementation: Spec + Theme -> poodle-node trees, interpreted by per-backend adapters."

[dependencies]
poodle-node = { path = "../contracts/node" }
poodle-adapter = { path = "../contracts/adapter" }
poodle-specs = { path = "../contracts/components" }
poodle-tokens = { path = "../contracts/tokens" }

[package.metadata.poodle]
public-intent = true
channel = "preview"
stability = "pre-release"

# Token resolution for tests. Pure contracts despite the name (verified: no
# jetstream dependency); the resolver logically belongs in contracts and its
# relocation is part of the migration.
[dev-dependencies]
poodle-jetstream = { path = "../jetstream/adapter" }
