<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Poodle external file fixture</title>
    <style>
      body { font-family: sans-serif; margin: 0; }
      #clip, #zone {
        width: 200px;
        padding: 16px;
        margin: 24px;
        border: 1px solid #444;
      }
      #clip { background: #eee; }
      #zone { background: #f7f7f7; min-height: 56px; }
      /* Fixed box: a probe that grows would resize the observed root. */
      #probe { margin: 16px; height: 24px; overflow: hidden; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="root">
      <button type="button" id="clip">Intro clip</button>
      <div id="zone">Sample library</div>
      <div id="probe" data-phase="idle" data-posture="" data-export="idle"></div>
      <div id="overlay" class="poodle-drag-overlay" aria-hidden="true"></div>
    </div>
    <script type="module" src="./files.ts"></script>
  </body>
</html>
