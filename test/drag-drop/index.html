<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Poodle drag-drop substrate fixture</title>
    <style>
      body { font-family: sans-serif; margin: 0; }
      #scroller {
        height: 240px;
        overflow: auto;
        border: 1px solid #888;
        margin: 16px;
      }
      #outer-scroll {
        height: 180px;
        overflow: auto;
        border: 1px solid #888;
        margin: 16px;
      }
      #inner-scroll {
        height: 90px;
        overflow: auto;
        margin: 24px 8px;
        border: 1px dashed #666;
      }
      #nested-source, #nested-target {
        width: 140px;
        padding: 8px;
        margin: 8px;
        border: 1px solid #444;
      }
      #spacer { height: 160px; }
      .nested-spacer { height: 120px; }
      #source, #target {
        width: 160px;
        padding: 12px;
        margin: 16px;
        border: 1px solid #444;
      }
      #link-source {
        display: inline-block;
        width: 160px;
        padding: 12px;
        margin: 16px;
        border: 1px solid #444;
      }
      #transformed-host {
        transform: translate(80px, 40px);
      }
      #target { background: #f7f7f7; min-height: 48px; }
      #probe { margin: 16px; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="transformed-host">
    <div id="root">
      <div id="scroller">
        <div id="spacer"></div>
        <button type="button" id="source">Alpha</button>
        <div id="target">List</div>
        <div id="spacer"></div>
      </div>
      <a id="link-source" href="#compat-click">Link source</a>
      <div id="outer-scroll">
        <div class="nested-spacer"></div>
        <div id="inner-scroll">
          <div class="nested-spacer" style="height: 100px"></div>
          <button type="button" id="nested-source">Nested Alpha</button>
          <div id="nested-target">Nested List</div>
          <div class="nested-spacer"></div>
        </div>
        <div class="nested-spacer"></div>
      </div>
      <button type="button" id="shift">Shift target</button>
      <div id="probe" data-phase="idle" data-captured="false" data-drop=""></div>
      <div id="live" class="poodle-drag-live-region" aria-live="polite"></div>
    </div>
    </div>
    <div id="overlay" class="poodle-drag-overlay" aria-hidden="true"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
