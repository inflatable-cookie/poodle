# Cross-framework visual gate — dispatches one of the named Effigy selectors.
# Diffs the Svelte and React previews pixel-for-pixel at the same specimen slug
# and display axis. Kept OUT of ci-web: it downloads a browser and boots two vite
# dev servers, which that gate deliberately excludes.
#
# MANUAL DISPATCH ONLY, for the same reason as ci-native: the nightly schedule
# fired on every day the branch moved. The axis tier is ~360 captures.
name: ci-visual

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "smoke | axis | sweep"
        default: axis
        required: false

concurrency:
  group: ci-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Browser binaries are versioned with the Playwright package.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Execute selected Effigy visual gate
        env:
          TIER: ${{ inputs.tier || 'axis' }}
        run: |
          set -euo pipefail
          case "$TIER" in
            smoke) effigy test:visual-smoke ;;
            axis) effigy ci:visual ;;
            sweep) effigy test:visual-sweep ;;
            *)
              echo "Unsupported visual tier: $TIER" >&2
              exit 1
              ;;
          esac

      # Diff images only exist when something failed; they are the whole point of
      # the run when it does.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: test/visual/out/
          retention-days: 14
