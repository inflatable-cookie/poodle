# Native headless gate — executes `effigy ci:native`.
# macOS only: GPUI pulls Metal and the board owns Poodle's native compile,
# adapter, regression, and specimen-construction checks.
# MANUAL DISPATCH ONLY. Run it before a tag, or when contract or spec changes
# could plausibly rot the native build.
#
# The board stops at Poodle-owned Rust, GPUI, and the in-repo Jetstream adapter;
# it does not require the sibling Jetstream engine repository.
name: ci-native

on:
  workflow_dispatch: {}

concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpui:
    runs-on: macos-latest
    timeout-minutes: 40
    # Shared target dir so the adapter, components, and preview crates reuse one
    # compiled GPUI dependency tree instead of building it per crate.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/ci-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # Rust 1.95
        with:
          toolchain: "1.95"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      # GPUI's dependency tree is large — cache aggressively to keep macOS
      # minutes down.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ci-target
          key: native-${{ runner.os }}-${{ hashFiles('packages/gpui/**/Cargo.lock', 'packages/gpui/**/Cargo.toml') }}
          restore-keys: native-${{ runner.os }}-

      - name: Execute Effigy native gate
        run: effigy ci:native
