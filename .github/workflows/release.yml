name: Release

# Publishes poodle-core and poodle-svelte to npm (spec 071).
#
# Two explicit modes over one retained workflow file:
#
#   candidate — dispatch on the reviewed web-candidate ref. Runs one Effigy
#               npm certificate entry, which admits the changed range and then
#               builds, packs and source-free-tests exactly one archive set.
#               Uploads those bytes plus their identity manifest.
#   publish   — dispatch on the matching vX.Y.Z tag with the candidate run ID.
#               Downloads that run's archive set, verifies tag/commit/version/
#               package/hash identity before any npm mutation, then publishes
#               those exact tarballs with trusted publishing. It never rebuilds.
#
# No long-lived npm token: npm trusted publishing exchanges a short-lived OIDC
# token for publish rights. Publication uses `--access public`, the runner is
# Linux, and the job hard-stops at ten minutes. Aggregate `qa`, Rust, native,
# GPUI and Jetstream selectors are not release authority and never appear here.
#
# Before the first run, each package needs its trusted publisher configured at
# npmjs.com -> package -> Settings -> Trusted Publisher, naming this repository
# and `release.yml`. Until that exists the publish step fails closed.
#
# poodle-react is deliberately not published. It stays private while following
# the lockstep web version.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidate to certify archives, publish to ship a certified run
        type: choice
        options: [candidate, publish]
        default: candidate
      candidate-run-id:
        description: Candidate run ID whose archive set is published (publish mode)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm web release (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # Hard ten-minute ceiling (spec 071). An over-budget npm run is a process
    # failure, not a reason to wait.
    timeout-minutes: 10
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for publish rights.
      id-token: write
      # Reads the named candidate run's uploaded archive set.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: changed-range admission needs the release-input range
          # and the base manifest, not a shallow tip.
          fetch-depth: 0

      # Expose origin/main for the changed-range classifier; without it,
      # `git merge-base HEAD origin/main` has no visible base.
      - run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Require an explicit supported mode
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            candidate|publish) ;;
            *)
              echo "Unsupported release mode: ${{ inputs.mode }}" >&2
              exit 1
              ;;
          esac

      # Publication is an act against a versioned tag, never a branch tip. A
      # candidate run uploads archives only and never reaches npm.
      - name: Require a versioned release tag when publishing
        if: ${{ inputs.mode == 'publish' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          echo "publish mode requires refs/tags/v* (got ${GITHUB_REF})." >&2
          exit 1

      - name: Require a candidate run ID when publishing
        if: ${{ inputs.mode == 'publish' && inputs.candidate-run-id == '' }}
        run: |
          set -euo pipefail
          echo "publish mode requires candidate-run-id naming a successful candidate run." >&2
          exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing requires npm >=11.5.1 and Node >=22.14.0.
      - name: Install the reviewed npm trusted-publishing CLI
        run: |
          set -euo pipefail
          npm_cli="$RUNNER_TEMP/npm-cli"
          npm install --prefix "$npm_cli" --no-save npm@12.0.2
          test "$("$npm_cli/node_modules/.bin/npm" --version)" = "12.0.2"
          echo "$npm_cli/node_modules/.bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      # Candidate mode: the one Effigy release entry. It separates changed-range
      # admission from archive certification and builds/packs once.
      - name: npm web certificate
        if: ${{ inputs.mode == 'candidate' }}
        env:
          POODLE_WEB_PACK_INSTALL_ARCHIVE_OUT: ${{ github.workspace }}/release-artifacts
        run: effigy release:web-certificate

      - name: Verify the candidate archive set
        if: ${{ inputs.mode == 'candidate' }}
        run: |
          set -euo pipefail
          bun scripts/verify-npm-candidate.ts \
            --root . \
            --manifest release-artifacts/poodle-npm-candidate.json \
            --dir release-artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.mode == 'candidate' }}
        with:
          name: poodle-npm-candidate
          path: release-artifacts/**
          if-no-files-found: error

      # Publish mode: consume the named candidate run's exact bytes. No build.
      - name: Download the certified candidate archive set
        if: ${{ inputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh run download "${{ inputs.candidate-run-id }}" \
            --name poodle-npm-candidate \
            --dir release-artifacts

      - name: Verify tag, commit, version, packages and hashes
        if: ${{ inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          bun scripts/verify-npm-candidate.ts \
            --root . \
            --manifest release-artifacts/poodle-npm-candidate.json \
            --dir release-artifacts \
            --tag-version "${GITHUB_REF_NAME#v}" \
            --source-commit "$(git rev-parse HEAD)"

      # Publish the archives, never a package directory. Public access is the
      # package-release guard.
      - name: Publish the certified archives
        if: ${{ inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release-artifacts/*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "no certified tarballs to publish" >&2
            exit 1
          fi
          for tarball in "${tarballs[@]}"; do
            npm publish "$tarball" --access public
          done

      - name: Verify registry availability
        if: ${{ inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("release-artifacts/poodle-npm-candidate.json", "utf8"));
            for (const entry of manifest.packages) console.log(`${entry.name}@${entry.version}`);
          ' | while IFS= read -r spec; do
            expected="${spec##*@}"
            published="$(npm view "$spec" version)"
            if [ "$published" != "$expected" ]; then
              echo "$spec resolved $published from the registry" >&2
              exit 1
            fi
          done
