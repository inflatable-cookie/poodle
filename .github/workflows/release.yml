name: Release

# Publishes poodle-core and poodle-svelte to npm.
#
# No long-lived npm registry token. Publication uses npm trusted publishing: npmjs.com is
# configured to accept publishes for each package only from this repository and
# this workflow file, and npm authenticates with a short-lived OIDC token minted
# per run. Nothing long-lived is stored in GitHub, so there is no secret for a
# compromised dependency to exfiltrate and nothing to rotate. Provenance
# attestation comes with it rather than being a separate step.
#
# The release authority is the single Effigy gate configured in `effigy.toml`.
# `effigy release gates` runs the same complete headless `effigy qa` board as a
# local release check; this workflow does not maintain a second selector list.
# Do not reach for `bunx effigy` -- an unrelated package of that name exists on
# npm, and fetching it inside a workflow holding publish rights is the exact
# hazard trusted publishing exists to remove.
#
# Before the first run, each package needs its trusted publisher configured at
# npmjs.com -> package -> Settings -> Trusted Publisher, naming this repository
# and `release.yml`. Until that exists the publish step fails closed.
#
# poodle-react is deliberately not published. It has no consumers, and the name
# stays reserved under the claimed scope. When it does ship it ships at the
# common version, not at 0.1.0 from a standing start.

# Dispatch this workflow AGAINST THE TAG, not against main:
#
#     git tag v0.2.0 && git push origin v0.2.0
#     gh workflow run release.yml --ref v0.2.0 -f dry-run=false
#
# workflow_dispatch accepts a tag ref, so `github.ref` is `refs/tags/v0.2.0`
# and the version-agrees-with-tag check below still fires. There is no
# `push: tags` trigger: publication should be an act someone performs, not a
# side effect of pushing a tag, and during first publication a tag push would
# fire a run that tries to republish versions already on the registry.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish to npm
    # The configured `effigy qa` release board includes the headless native
    # lane, which needs macOS for GPUI/Metal. Native visual and paired Jetstream
    # sweeps remain outside the board.
    runs-on: macos-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for publish rights. This is the
      # whole reason no secret is needed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing requires npm >=11.5.1 and Node >=22.14.0.
      - name: Install the reviewed npm trusted-publishing CLI
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - run: bun install --frozen-lockfile

      # The configured gate runs the complete headless board: web, Rust, native,
      # packed-install, licence, security, and release-automation checks.
      - name: Release gates
        run: effigy release gates

      # Within this repository, every Rust crate and every TypeScript package
      # carries one version, so a tag names all of them at once. Lockstep stops
      # at the repository boundary -- Poodle versions independently of Longhorn,
      # which depends on it by ordinary semver range.
      - name: Versions agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for manifest in \
            packages/core/package.json \
            packages/svelte/components/package.json \
            packages/react/components/package.json; do
            version=$(node -p "require('./$manifest').version")
            if [ "$version" != "$tag" ]; then
              echo "$manifest is $version, tag is $tag"
              status=1
            fi
          done
          # Lockstep spans languages, not just the published packages: the tag
          # is the Rust distribution point too, so every crate must carry it.
          while IFS= read -r -d '' manifest; do
            name=$(grep -m1 '^name' "$manifest" | cut -d'"' -f2)
            version=$(grep -m1 '^version' "$manifest" | cut -d'"' -f2)
            if [ -n "$version" ] && [ "$version" != "$tag" ]; then
              echo "crate $name is $version, tag is $tag"
              status=1
            fi
          done < <(find packages -name Cargo.toml -not -path '*/target/*' -print0)
          exit "$status"

      # Asserts rather than prints. A listing of the first twenty entries is
      # alphabetical CSS and proves nothing; what matters is that the generated
      # icon and token artifacts survived into the tarball, since they are
      # committed source that the release gate checks but `files` could still
      # miss.
      #
      # Do not pipe `tar -tzf` into `head`: GNU tar treats the EPIPE as an error
      # and `set -o pipefail` fails the step. BSD tar does not, so it passes on
      # macOS and breaks on ubuntu.
      - name: Pack and verify contents
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for dir in packages/core packages/svelte/components; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts")
          done
          ls -l release-artifacts

          status=0
          require() { # tarball, description, pattern, minimum
            local n
            n=$(grep -c -- "$3" "$listing" || true)
            if [ "$n" -lt "$4" ]; then
              echo "  MISSING $2: $n matching [$3], expected at least $4"
              status=1
            else
              echo "  ok $2: $n"
            fi
          }

          listing=$(mktemp)
          for tarball in release-artifacts/*.tgz; do
            bytes=$(wc -c < "$tarball")
            echo "== $tarball ($bytes bytes)"
            tar -tzf "$tarball" > "$listing"
            entries=$(wc -l < "$listing")
            echo "  $entries entries"
            require "$tarball" "licence"      "^package/LICENSE$"          1
            require "$tarball" "readme"       "^package/README.md$"        1
            require "$tarball" "manifest"     "^package/package.json$"     1
            case "$tarball" in
              *poodle-core*)
                # Both directories are generated and committed. The counts are
                # floors, not exact: 100 icon modules and 22 token stylesheets
                # today, and an empty or partial generation is the thing worth
                # catching.
                require "$tarball" "icon modules"   "^package/src/icons/icons/.*\.ts$" 50
                require "$tarball" "icon aliases"   "^package/src/icons/aliases\.generated\.ts$" 1
                require "$tarball" "token css"      "^package/src/tokens/generated/css/.*\.css$" 20
                ;;
            esac
          done
          rm -f "$listing"
          exit "$status"

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          for dir in packages/core packages/svelte/components; do
            (cd "$dir" && npm publish --access public)
          done

      # if-no-files-found: error, not the default warn. The first green run
      # uploaded nothing: the directory was `.release`, and upload-artifact v4
      # skips hidden files unless told otherwise. It warned and passed. This is
      # the artifact a first publication is bootstrapped from, so its absence
      # has to fail the run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-tarballs
          path: release-artifacts/*.tgz
          if-no-files-found: error
