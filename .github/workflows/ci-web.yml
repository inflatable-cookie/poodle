# Web gate — executes `effigy ci:web`. Bun only, ubuntu (1x minutes).
name: ci-web

on:
  # Manual dispatch only. The path-filtered push and pull_request triggers ran
  # this on nearly every commit to the default branch; combined with the
  # macOS lanes that exhausted the org's Actions allowance and left dispatched
  # runs queued indefinitely. Run this before a tag, and locally otherwise.
  workflow_dispatch: {}

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      # Cache the bun install store, keyed on the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Execute Effigy web gate
        run: effigy ci:web
