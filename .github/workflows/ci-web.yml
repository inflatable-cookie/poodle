# Web gate — mirrors `effigy ci:web`. Node/bun only, ubuntu (1x minutes).
name: ci-web

on:
  # Manual dispatch only. The path-filtered push and pull_request triggers ran
  # this on nearly every commit to the default branch; combined with the
  # nightly macOS lanes that exhausted the org's Actions allowance and left
  # dispatched runs queued indefinitely. Run this before a tag, and locally
  # otherwise -- `effigy ci` is the same selector set.
  workflow_dispatch: {}

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Cache the bun install store, keyed on the lockfile.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # ── effigy ci:web ──────────────────────────────────────────────
      - name: core state-machine tests
        run: bun run --cwd packages/core test
      - name: component + parity tests (svelte + react)
        run: bunx vitest run
      # Type gate over @inflatable-cookie/poodle-svelte. install-smoke is outside the root
      # workspace on purpose (it proves a real consumer install), so it installs
      # its own deps; svelte-check then covers the whole linked component
      # package. Errors fail, pre-existing a11y warnings do not.
      - name: svelte component typecheck
        run: |
          bun install --cwd packages/svelte/install-smoke
          bun run --cwd packages/svelte/install-smoke check --threshold error

      - name: contract / manifest lint
        run: bun run --cwd packages/svelte/preview docs:lint
      - name: parity report (tokens:build + data-layer smoke)
        run: |
          bun packages/tokens/scripts/build-tokens.ts
          bun run --cwd packages/svelte/preview parity:report
      - name: accessibility report (data-layer smoke)
        run: bun run --cwd packages/svelte/preview accessibility:report
