# Rust gate — executes `effigy ci:rust`. Pure contract crates only, ubuntu.
# Native crates are owned by the separate macOS `ci:native` selector.
name: ci-rust

on:
  # Manual dispatch only. The path-filtered push and pull_request triggers ran
  # this on nearly every commit to the default branch; combined with the
  # macOS lanes that exhausted the org's Actions allowance and left dispatched
  # runs queued indefinitely. Run this before a tag, and locally otherwise.
  workflow_dispatch: {}

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One shared target dir across the 8 separate crate trees, so common deps
    # (poodle-headless, poodle-tokens) compile once instead of per-crate.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/ci-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # Rust 1.95
        with:
          toolchain: "1.95"

      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ci-target
          key: rust-${{ runner.os }}-${{ hashFiles('packages/contracts/**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Execute Effigy Rust gate
        run: effigy ci:rust
