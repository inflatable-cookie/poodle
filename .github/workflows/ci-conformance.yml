# Executed active-cohort conformance gate. GPUI needs a macOS window server;
# Jetstream is program-deferred and deliberately absent from this board.
name: ci-conformance

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/ci-conformance.yml"
      - "bun.lock"
      - "effigy.toml"
      - "tasks/effigy.tasks.toml"
      - "packages/core/src/conformance/**"
      - "packages/core/scripts/conformance-*"
      - "packages/codegen/**"
      - "packages/contracts/components/**"
      - "packages/contracts/node/**"
      - "packages/render/**"
      - "packages/gpui/**"
      - "packages/svelte/components/src/Button.svelte"
      - "packages/react/components/src/Button.tsx"
      - "test/conformance/**"

concurrency:
  group: ci-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  active-cohort:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/ci-target
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: inflatable-cookie/setup-effigy@v1
        with:
          version: "0.9.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ci-target
          key: conformance-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/codegen/Cargo.lock', 'packages/gpui/**/Cargo.lock', 'packages/render/Cargo.lock') }}
          restore-keys: conformance-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Execute conformance board
        run: effigy ci:conformance
