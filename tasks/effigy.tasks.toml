[tasks]
"bootstrap:deps" = [
  "bun install",
  "cargo fetch",
]

# Token system
"tokens:build" = "bun packages/tokens/scripts/build-tokens.ts"

# Preview (documentation site)
"svelte:build" = "bun run --cwd packages/svelte/preview build"
"svelte:run" = "bun run --cwd packages/svelte/preview dev"
"svelte:preview" = [{ task = "svelte:run"}]
"svelte:surface-audit" = "bun packages/svelte/components/scripts/surface-audit.ts"

# React preview (component gallery, mirrors the Svelte preview)
"react:build" = "bun run --cwd packages/react/preview build"
"react:run" = "bun run --cwd packages/react/preview dev"
"react:preview" = [{ task = "react:run" }]
"react:reports" = "bun run --cwd packages/react/preview reports"

# GPUI native preview (macOS)
"gpui:build" = "cargo build -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:run" = "cargo run -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:test" = "cargo test -p poodle-gpui --manifest-path packages/gpui/adapter/Cargo.toml"
"gpui:preview" = [{ task = "gpui:run" }]

# Jetstream native preview (game engine)
"jetstream:build" = "cargo build -p poodle-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:run" = "cargo run -p poodle-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:test" = "cd packages/jetstream/adapter && cargo test"
"jetstream:preview" = [{ task = "jetstream:run" }]

# Reports
"report:parity" = [
  { task = "tokens:build" },
  { run = "bun run --cwd packages/svelte/preview parity:report" },
]
"report:accessibility" = "bun run --cwd packages/svelte/preview accessibility:report"

# CI gates — light, ubuntu-only. No native (gpui/jetstream) crates, no vite
# preview builds. The GitHub workflows (.github/workflows/ci-*.yml) mirror
# ci:web / ci:rust so CI needs no effigy bootstrap; `effigy ci` is the local gate.
"test:core" = "bun run --cwd packages/core test"
# Component-shell smoke + interaction tests (Svelte + React) via vitest/happy-dom.
# Verifies the machine -> DOM wiring the framework packages add on top of the
# @poodle/headless machines (which test:core covers).
"test:components" = "bunx vitest run"
# Svelte <-> React anatomy parity gate (subset of the vitest run above; also
# usable standalone). Diffs the poodle-* classes each implementation emits.
"test:parity" = "bunx vitest run --project parity"
# Runtime accessibility sweep (axe-core) over every Svelte component. Runs inside
# test:components already; A11Y_REPORT=1 lists findings instead of failing.
"test:a11y" = "bunx vitest run --project a11y"
# Cross-framework visual gate (g12.009): boots both vite previews and pixel-diffs
# the Svelte and React specimens at the same slug + axis. Needs a browser
# (`bunx playwright install chromium`) and two preview servers, so it stays out of
# ci:web — ci:visual is the gate, mirroring how ci:native handles the crates.
# Tiers: smoke (15 components, 1 axis), axis (15 x 12 size/density/contrast axes),
# sweep (every specimen slug x 2 themes).
"test:visual" = "bun test/visual/run.ts --tier=axis"
"test:visual-smoke" = "bun test/visual/run.ts --tier=smoke"
"test:visual-sweep" = "bun test/visual/run.ts --tier=sweep"
# Same capture, never fails the process — writes diffs + summary to test/visual/out.
"visual:report" = "bun test/visual/run.ts --tier=sweep --report"
"ci:visual" = [{ task = "test:visual" }]

# Native visual gate (g12.014). Baseline-based rather than cross-target: GPUI is
# a different renderer, so a diff against Svelte would be all noise. LOCAL-ONLY —
# the GPUI preview screenshots its own window, so it needs a live macOS window
# server, same constraint as check:jetstream.
"test:native-visual" = "bun test/native-visual/run.ts"
"native-visual:update" = "bun test/native-visual/run.ts --update"

# Jetstream native visual gate — headless offscreen render, no window server.
# 135 specimens in ~90s with zero flake, where the GPUI gate takes ~20min with
# ~3%. This is the one to trust. Still local-only, but only because it needs the
# sibling jetstream repo — nothing about it requires a display.
"test:jetstream-visual" = "bun test/native-visual/jetstream.ts"
"jetstream-visual:update" = "bun test/native-visual/jetstream.ts --update"
# Reads the preview's real macOS accessibility tree through AXUIElement.
# Local-only: needs a window server and Accessibility permission.
"test:jetstream-ax" = "bun test/native-visual/ax-audit.ts"
"jetstream-ax:dump" = "bun test/native-visual/ax-audit.ts --dump"
# Projects every specimen's accessibility tree headlessly — no window, no
# display, all 132 specimens. Complements test:jetstream-ax, which proves the
# tree reaches macOS but only for the screen the preview is showing.
"test:jetstream-a11y" = "cargo run --quiet --manifest-path packages/jetstream/preview/Cargo.toml --bin a11y"
"jetstream-a11y:roles" = "cargo run --quiet --manifest-path packages/jetstream/preview/Cargo.toml --bin a11y -- --roles"
# Contract ARIA roles vs the roles Jetstream actually projects — the
# accessibility counterpart of contract-spec-drift. Not gating yet: 73 of 124
# requirements are unmet, and some are overlay states no specimen renders.
"drift:roles" = "bun --cwd packages/svelte/preview scripts/contract-role-drift.ts"

# Svelte type gate over @poodle/svelte. Driven through the install-smoke consumer
# because svelte-check needs a tsconfig + a resolved `svelte` — and it type-checks
# the WHOLE linked component package, not just what the smoke app imports
# (verified: an error planted in an unimported component fails this). install-smoke
# sits outside the root workspace on purpose (it proves a real consumer install),
# so it needs its own install first. Errors fail; the 6 pre-existing a11y warnings
# do not.
"check:svelte" = [
  { run = "bun install --cwd packages/svelte/install-smoke" },
  { run = "bun run --cwd packages/svelte/install-smoke check --threshold error" },
]

# Contract <-> Svelte prop-surface drift. Runs inside docs:lint already; this
# selector is for standalone/report use (DRIFT_REPORT=1 also lists svelte-only).
"docs:contract-drift" = "bun packages/svelte/preview/scripts/contract-prop-drift.ts"
# Contract <-> poodle-specs drift. Also runs inside docs:lint; this selector is
# for standalone/report use (DRIFT_REPORT=1 lists gaps without failing).
"docs:spec-drift" = "bun packages/svelte/preview/scripts/contract-spec-drift.ts"
# Pure contract crates only — each is a separate crate tree, all cross-platform
# (no gpui/game_ui deps). Native component crates are covered locally/nightly.
"test:contracts" = [
  { run = "cargo test --manifest-path packages/contracts/headless/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/components/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/layout/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/style/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/events/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/adapter/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/tokens/Cargo.toml" },
]
"ci:web" = [
  { task = "test:core" },
  { task = "test:components" },
  { task = "check:svelte" },
  { task = "docs:lint" },
  { task = "report:parity" },
  { task = "report:accessibility" },
]
"ci:rust" = [{ task = "test:contracts" }]
"ci" = [
  { task = "ci:web" },
  { task = "ci:rust" },
]

# Native compile-rot check (macOS: gpui pulls metal). The native component crates
# have no unit tests yet, so `cargo check` is the gate — it catches build rot from
# contract/spec changes. jetstream/components needs the sibling jetstream-runtime
# repo, so it is LOCAL-ONLY; the scheduled workflow (ci-native.yml) checks gpui only.
"check:gpui" = [
  { run = "cargo check -p poodle-gpui-components --manifest-path packages/gpui/components/Cargo.toml" },
  { run = "cargo check -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml" },
]
"check:jetstream" = "cargo check -p poodle-jetstream-components --manifest-path packages/jetstream/components/Cargo.toml"
# The a11y audit belongs here rather than in ci:rust: it renders specimens, so
# it needs the sibling jetstream repo — the same constraint that already makes
# this group local-only. It is a real gate now that the count is zero; before
# that it would only have reported a number.
"ci:native" = [
  { task = "check:gpui" },
  { task = "check:jetstream" },
  { task = "test:jetstream-a11y" },
]

# Documentation
"docs:lint" = "bun run --cwd packages/svelte/preview docs:lint"
"docs:dev" = [{ task = "svelte:run" }]
"docs:build" = [{ task = "svelte:build" }]
"docs:check" = [
  { task = "docs:lint" },
  { task = "report:parity" },
  { task = "report:accessibility" },
  { task = "docs:build" },
]

# Legacy aliases for compatibility
"parity:check" = [{ task = "docs:check" }]
"parity:report" = [{ task = "report:parity" }]

# Health check aggregator
health = [{ task = "docs:check" }]
