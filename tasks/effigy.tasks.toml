[tasks]
# No root Cargo.toml on purpose: the crates are independent (the jetstream
# tree path-depends on the sibling engine repo), so Rust deps are fetched
# per manifest by the script rather than assuming a workspace at the root.
"bootstrap:deps" = [
  "bun install",
  "bun scripts/bootstrap-rust.ts",
]

# Token system
"tokens:build" = "bun packages/tokens/scripts/build-tokens.ts"
"icons:build" = "bun scripts/build-default-icons.ts"
"audit:icons" = "bun scripts/build-default-icons.ts --check"
# Generated token artifacts are committed so a clean clone packs a complete
# tarball with no build step. Committing generated source is only safe when
# something fails if the tree and the generator disagree -- this is that.
"audit:tokens" = "bun packages/tokens/scripts/build-tokens.ts --check"

# IR code generation (g13.003; the shell scene is g13.004 card 035). The
# generated TypeScript under packages/codegen/generated/ is committed for
# the same reason the token artifacts are: a clean clone packs everything.
# `ir:check` is the gate -- read-only, byte-exact, whitespace-classified,
# orphan-aware -- and `ir:build` is its write-mode twin. Like
# `tokens:build`, the write selector never composes into a gate (that
# composition is the 45caae82 failure); gates may only reach `*:check`.
#
# Card 035 R1: the shell scene is authored in Rust
# (packages/codegen/src/models/preview_shell.rs) and serialized to its own
# fixture by `--author-shell`; the emitter fixture (synthetic-model.json)
# is untouched. The shell-scene target renders that model into the
# consuming web packages' generated/ directories and its card-036 Rust
# sibling (shell-rust) into the native previews' generated/ directories
# (g13-b003 R1; card 036 R2); neither is part of the default target set,
# so a plain run over the synthetic fixture never writes into a consumer
# package. Component models were unwound in g13-053; only the shell scene
# remains. g14-b004 adds machine-interface targets (select-only, like the
# shell) from packages/contracts/headless/machine-interfaces.json into the
# core and headless generated/machines/ directories.
"ir:build" = [
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-shell packages/codegen/fixtures/shell-model.json" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-specimens packages/codegen/fixtures/specimens-model.json" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/synthetic-model.json --out packages/codegen/generated" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/svelte/preview/src --target shell-scene" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/react/preview/src --target shell-scene" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/gpui/preview/src --target shell-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/jetstream/preview/src --target shell-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/core/src --target machine-ts" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/contracts/headless/src --target machine-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/svelte/preview/src --target specimen-ts" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/react/preview/src --target specimen-ts" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/gpui/preview/src --target specimen-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/jetstream/preview/src --target specimen-rust" },
]
"ir:check" = [
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-shell packages/codegen/fixtures/shell-model.json --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-specimens packages/codegen/fixtures/specimens-model.json --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/synthetic-model.json --out packages/codegen/generated --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/svelte/preview/src --target shell-scene --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/react/preview/src --target shell-scene --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/gpui/preview/src --target shell-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/jetstream/preview/src --target shell-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/core/src --target machine-ts --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/contracts/headless/src --target machine-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/svelte/preview/src --target specimen-ts --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/react/preview/src --target specimen-ts --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/gpui/preview/src --target specimen-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/jetstream/preview/src --target specimen-rust --check" },
]

# Conformance kernel (g14.001, spec 066): the Button proof loop — portable
# interface + typed case corpus -> four runtimes -> component-observation.v1
# -> one completion gate. The authority lives in TypeScript
# (packages/core/src/conformance/); `conformance:build` serializes it to the
# neutral JSON fixtures and generates the Rust declaration surface; `*:check`
# twins are read-only and gate the tree. Gates may only reach `*:check` and
# the test/compare selectors — write-mode generation is never composed into
# a gate (the 45caae82 lesson).
"conformance:serialize" = "bun packages/core/scripts/conformance-serialize.ts"
"conformance:serialize-check" = "bun packages/core/scripts/conformance-serialize.ts --check"
"conformance:codegen" = [
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --conformance packages/codegen/fixtures/conformance/button-interface.json --cases packages/codegen/fixtures/conformance/button-cases.json --out packages/contracts/components/src --target conformance-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --conformance packages/codegen/fixtures/conformance/button-interface.json --cases packages/codegen/fixtures/conformance/button-cases.json --out packages/gpui/preview/src --target conformance-cases" },
]
"conformance:codegen-check" = [
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --conformance packages/codegen/fixtures/conformance/button-interface.json --cases packages/codegen/fixtures/conformance/button-cases.json --out packages/contracts/components/src --target conformance-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --conformance packages/codegen/fixtures/conformance/button-interface.json --cases packages/codegen/fixtures/conformance/button-cases.json --out packages/gpui/preview/src --target conformance-cases --check" },
]
"conformance:build" = [
  { task = "conformance:serialize" },
  { task = "conformance:codegen" },
]
# Read-only enforcement surface: fixture + generated artifact drift, then the
# executions. Runs inside docs:check / ci:web / ci:native.
"conformance:check" = [
  { task = "conformance:serialize-check" },
  { task = "conformance:codegen-check" },
]
"conformance:test-web" = "bunx vitest run --project conformance"
# LOCAL-ONLY, like test:native-visual: opens a real GPUI window and drives
# real NSEvents through the AppKit queue (hit testing, listener binding,
# focus, activation). Needs a macOS window server.
"conformance:test-gpui" = "cargo run --quiet --manifest-path packages/gpui/preview/Cargo.toml --bin conformance -- --out=test/conformance/web/out/gpui.json"
# Compile-only twin for CPU gates: the windowed execution is local-only.
"conformance:check-gpui" = "cargo check --manifest-path packages/gpui/preview/Cargo.toml --bin conformance"
"conformance:test" = [
  { task = "conformance:test-web" },
  { task = "conformance:test-gpui" },
]
"conformance:compare" = "bun test/conformance/compare.ts"
# The completion gate: drift-free authority, then all four runtimes, then the
# cross-runtime comparison. `--component button` is the pilot profile.
# The completion gate: drift-free authority, then all three active runtimes,
# then the cross-runtime comparison. Jetstream is program-deferred (working
# rules): it is reported as deferred, never as passing.
"conformance:complete" = [
  { task = "conformance:check" },
  { task = "conformance:test-web" },
  { task = "conformance:test-gpui" },
  { task = "conformance:compare" },
]
"conformance:cost" = "bun packages/core/scripts/conformance-cost.ts"

# Preview (documentation site)
"svelte:build" = "bun run --cwd packages/svelte/preview build"
"svelte:run" = "bun run --cwd packages/svelte/preview dev"
"svelte:preview" = [{ task = "svelte:run"}]
"svelte:surface-audit" = "bun packages/svelte/components/scripts/surface-audit.ts"

# React preview (component gallery, mirrors the Svelte preview)
"react:build" = "bun run --cwd packages/react/preview build"
"react:run" = "bun run --cwd packages/react/preview dev"
"react:preview" = [{ task = "react:run" }]
"react:docs" = "bun run --cwd packages/react/preview docs:export"
"react:reports" = "bun run --cwd packages/react/preview reports"

# GPUI native preview (macOS)
"gpui:build" = "cargo build -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:run" = "cargo run -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:test" = "cargo test -p poodle-gpui --manifest-path packages/gpui/adapter/Cargo.toml"
"gpui:preview" = [{ task = "gpui:run" }]

# Jetstream native preview (game engine)
"jetstream:build" = "cargo build -p poodle-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:run" = "cargo run -p poodle-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:test" = "cd packages/jetstream/adapter && cargo test"
"jetstream:preview" = [{ task = "jetstream:run" }]

# Reports
"report:parity" = [
  { task = "tokens:build" },
  { run = "bun run --cwd packages/svelte/preview parity:report" },
  { run = "bun run --cwd packages/react/preview parity:report" },
]
"report:accessibility" = [
  { run = "bun run --cwd packages/svelte/preview accessibility:report" },
  { run = "bun run --cwd packages/react/preview accessibility:report" },
]

# CI gates — light, ubuntu-only. No native (gpui/jetstream) crates, no vite
# preview builds. The GitHub workflows (.github/workflows/ci-*.yml) mirror
# ci:web / ci:rust so CI needs no effigy bootstrap; `effigy ci` is the local gate.
"test:core" = "bun run --cwd packages/core test"
# Component-shell smoke + interaction tests (Svelte + React) via vitest/happy-dom.
# Verifies the machine -> DOM wiring the framework packages add on top of the
# @inflatable-cookie/poodle-core machines (which test:core covers).
"test:components" = "bunx vitest run"
"test:web-pack-install" = "bun test/package-install/web-preview.ts"
# Compatibility selector for existing downstream handoffs and historical docs.
"test:svelte-pack-install" = [{ task = "test:web-pack-install" }]
"audit:security" = [
  { run = "bun scripts/audit-repository-security.ts" },
  { run = "bun audit" },
  { run = "cargo deny --manifest-path packages/render/Cargo.toml check advisories sources" },
  { run = "cargo deny --manifest-path packages/gpui/node-backend/Cargo.toml check advisories sources" },
  { run = "cargo deny --manifest-path packages/gpui/adapter/Cargo.toml check advisories sources" },
  { run = "cargo deny --manifest-path packages/jetstream/adapter/Cargo.toml check advisories sources" },
]
"audit:licenses" = [
  { run = "bun scripts/audit-license-compliance.ts" },
  { run = "cargo deny --manifest-path packages/render/Cargo.toml check licenses" },
  { run = "cargo deny --manifest-path packages/gpui/node-backend/Cargo.toml check licenses" },
  { run = "cargo deny --manifest-path packages/gpui/adapter/Cargo.toml check licenses" },
  { run = "cargo deny --manifest-path packages/jetstream/adapter/Cargo.toml check licenses" },
]
# Svelte <-> React anatomy parity gate (subset of the vitest run above; also
# usable standalone). Diffs the poodle-* classes each implementation emits.
"test:parity" = "bunx vitest run --project parity"
# Runtime accessibility sweep (axe-core) over every Svelte component. Runs inside
# test:components already; A11Y_REPORT=1 lists findings instead of failing.
"test:a11y" = "bunx vitest run --project a11y"
# Cross-framework visual gate (g12.009): boots both vite previews and pixel-diffs
# the Svelte and React specimens at the same slug + axis. Needs a browser
# (`bunx playwright install chromium`) and two preview servers, so it stays out of
# ci:web — ci:visual is the gate, mirroring how ci:native handles the crates.
# Tiers: smoke (15 components, 1 axis), axis (15 x 12 size/density/contrast axes),
# sweep (every specimen slug x 2 themes).
"test:visual" = "bun test/visual/run.ts --tier=axis"
"test:visual-smoke" = "bun test/visual/run.ts --tier=smoke"
"test:visual-sweep" = "bun test/visual/run.ts --tier=sweep"
# Same capture, never fails the process — writes diffs + summary to test/visual/out.
"visual:report" = "bun test/visual/run.ts --tier=sweep --report"
"ci:visual" = [{ task = "test:visual" }]

# Native visual gate (g12.014). Baseline-based rather than cross-target: GPUI is
# a different renderer, so a diff against Svelte would be all noise. LOCAL-ONLY —
# the GPUI preview screenshots its own window, so it needs a live macOS window
# server, same constraint as check:jetstream.
"test:native-visual" = "bun test/native-visual/run.ts"
"native-visual:update" = "bun test/native-visual/run.ts --update"

# Jetstream native visual gate — headless offscreen render, no window server.
# 135 specimens in ~90s with zero flake, where the GPUI gate takes ~20min with
# ~3%. This is the one to trust. Still local-only, but only because it needs the
# sibling jetstream repo — nothing about it requires a display.
"test:jetstream-visual" = "bun test/native-visual/jetstream.ts"
"jetstream-visual:update" = "bun test/native-visual/jetstream.ts --update"
# Reads the preview's real macOS accessibility tree through AXUIElement.
# Local-only: needs a window server and Accessibility permission.
"test:jetstream-ax" = "bun test/native-visual/ax-audit.ts"
"jetstream-ax:dump" = "bun test/native-visual/ax-audit.ts --dump"
# Projects every specimen's accessibility tree headlessly — no window, no
# display, all 132 specimens. Complements test:jetstream-ax, which proves the
# tree reaches macOS but only for the screen the preview is showing.
"test:jetstream-a11y" = "cargo run --quiet --manifest-path packages/jetstream/preview/Cargo.toml --bin a11y"
"jetstream-a11y:roles" = "cargo run --quiet --manifest-path packages/jetstream/preview/Cargo.toml --bin a11y -- --roles"
# Contract ARIA roles vs the roles Jetstream actually projects — the
# accessibility counterpart of contract-spec-drift.
#
# Gating. It gated once before on a false zero: the exemption list was written
# by reasoning rather than checking, and hid 20 real gaps behind "needs an
# overlay open". The list is now verified against the specimen sources, so a
# component whose specimen opens the overlay cannot claim the excuse.
"drift:roles" = "bun --cwd packages/svelte/preview scripts/contract-role-drift.ts"

# Svelte type gate over @inflatable-cookie/poodle-svelte. Driven through the install-smoke consumer
# because svelte-check needs a tsconfig + a resolved `svelte` — and it type-checks
# the WHOLE linked component package, not just what the smoke app imports
# (verified: an error planted in an unimported component fails this). install-smoke
# sits outside the root workspace on purpose (it proves a real consumer install),
# so it needs its own install first. Errors fail; the 6 pre-existing a11y warnings
# do not.
"check:svelte" = [
  { run = "bun install --cwd packages/svelte/install-smoke" },
  { run = "bun run --cwd packages/svelte/install-smoke check --threshold error" },
  { task = "check:svelte-components" },
]

# Type-checks the 165 shipped components. Until this existed, `check:svelte`
# only covered `install-smoke` -- 4 files, reported as "COMPLETED 1 FILES" --
# so nothing in `packages/svelte/components/src` was ever type-checked, and a
# consumer's own type-check found a Poodle error before Poodle did.
"check:svelte-components" = "bunx svelte-check --workspace packages/svelte/components --tsconfig ./tsconfig.json --threshold error"

# Contract <-> Svelte prop-surface drift. Runs inside docs:lint already; this
# selector is for standalone/report use (DRIFT_REPORT=1 also lists svelte-only).
"docs:contract-drift" = "bun packages/svelte/preview/scripts/contract-prop-drift.ts"
# Contract <-> Svelte callback-surface drift: every `on*` function-typed prop a
# component emits must be named in its contract's Callbacks/Events section.
# contract-prop-drift deliberately skips `on*` props, so before this nothing
# checked them. Runs inside docs:lint; this selector is for standalone use.
"docs:callback-drift" = "bun packages/svelte/preview/scripts/contract-callback-drift.ts"
# Self-referential container queries: an element cannot be matched by its own
# @container, so such rules resolve against the nearest ancestor instead. Found
# in 3 of 5 container-query stylesheets (g13-043). Runs inside docs:lint.
"docs:container-query-drift" = "bun packages/svelte/preview/scripts/container-query-drift.ts"
# React gallery specimen coverage. specimen-map.ts already asserts this, but by
# throwing at module load — which only happens in a browser. ci:web builds the
# React preview and never runs it, so on 2026-08-13 the gallery shipped fatally
# broken on main (update-center, update-status): the whole preview rendered
# zero characters with every gate green. This moves the check to build time.
"docs:react-specimen-drift" = "bun packages/svelte/preview/scripts/react-specimen-drift.ts"
# The g13.018 capability gate: every declared per-runtime capability row —
# provided, delegated, or absent with a reason — must be true against the
# runtime sources. Absence must stay true (Jetstream gains an edit handler
# while still declared as lacking text editing → fail) and a provision must
# have a trace (a runtime claiming a capability it does not implement →
# fail). Both directions proven live by card 051. Runs inside ci:web; this
# selector is for standalone/report use.
"docs:capability-drift" = "bun packages/svelte/preview/scripts/capability-drift.ts"
# Contract <-> poodle-specs drift. Also runs inside docs:lint; this selector is
# for standalone/report use (DRIFT_REPORT=1 lists gaps without failing).
"docs:spec-drift" = "bun packages/svelte/preview/scripts/contract-spec-drift.ts"
# Focus-ring radius drift (g13.037): a :focus-visible outline must land on an
# element the corpus gives a border-radius, or the ring renders square. The
# baseline holds rings that are square by intent, each with a reason. Also runs
# inside docs:lint; this selector is for standalone/report use.
"docs:focus-ring-drift" = "bun packages/svelte/preview/scripts/focus-ring-drift.ts"
# Contract <-> implementation value-domain drift: compares the permitted value
# set of each enumerated prop (contract union vs Svelte types.ts vs the
# poodle-specs enum). Report-only — exits 0 unless VALUE_DOMAIN_ENFORCE=1 is
# set (the inverse of DRIFT_REPORT). Deliberately not in docs:check until the
# inventory backlog is triaged; see docs/roadmaps/g13/batch-cards/007-value-domain-drift-inventory.md.
"docs:value-domain-drift" = "bun packages/svelte/preview/scripts/contract-value-domain-drift.ts"
# Machine-shape drift (g13.047 R5): every machine present in both runtimes must
# be pinned by a shared vector both harnesses run, and every transition must
# follow the documented shape (g11.002). Baselined: correctly-different modules
# with reasons. Standalone; the conformance vectors themselves run in test:core
# and test:contracts.
"docs:machine-shape-drift" = "bun packages/svelte/preview/scripts/machine-shape-drift.ts"
# A GPUI component that accepts a handler must use it. `Stepper` stored two and
# attached neither — the builders type-checked and nothing happened when you
# clicked. Runs in ci:native.
"drift:handlers" = "bun packages/gpui/preview/scripts/dead-handler-drift.ts"
# The other direction, and the rule `drift:clicks` used to cover from the far
# end: a contract that documents events must have somewhere to send them. An
# AlertDialog rendering Confirm and Cancel that no host can wire looks finished
# and is not. Carries a ratchet — the known-gap list can only shrink.
"drift:events" = "bun packages/gpui/preview/scripts/inert-component-drift.ts"
# Direct adapter manifests are independent runtime evidence, but must match the
# RenderComponent implementations they claim exactly.
"drift:adapter-manifests" = "bun packages/gpui/preview/scripts/adapter-manifest-drift.ts"
# The family-level Treatment layer is retired. Historical records and the
# architecture tombstone are preserved; active code, contracts, guides,
# previews, and current evidence must use component Recipes directly.
"drift:recipes" = "bun scripts/check-recipe-only-surface.ts"
# The Jetstream sibling, and stronger: GPUI can only check that a handler field
# is read, because a real click there needs a live window. Jetstream dispatches
# clicks with no window, so this demands a test that actually drives one. Also
# `drift:clicks` is retired: it proved a real pointer gesture reached every
# Jetstream builder, but its subject — `poodle-jetstream-components` and its
# `click_probe` tests — was deleted in `ee704699` when Jetstream moved onto
# `poodle-render` nodes. The adapter that replaced it lives in the sibling
# jetstream repo, which is outside this repo's boundary, so the gate has
# nothing here to watch. GPUI's `drift:handlers` survives and now covers the
# shared `poodle-render` handlers both targets render, and `drift:events`
# recovers the half of its rule that was genuinely lost: a control that is
# rendered but that no host can reach.
# Pure contract crates only — each is a separate crate tree, all cross-platform
# (no gpui/game_ui deps). Native component crates are covered locally/nightly.
"test:contracts" = [
  { run = "cargo test --manifest-path packages/contracts/headless/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/markdown/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/components/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/layout/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/style/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/events/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/adapter/Cargo.toml" },
  { run = "cargo test --manifest-path packages/contracts/tokens/Cargo.toml" },
]
# Fails if the working tree is dirty. Belongs at the END of any gate that
# runs a write-mode generator.
#
# `ci:web` and `docs:check` both do: `react:docs`, `report:parity` and
# `report:accessibility` are writers, and `report:parity` reaches `tokens:build`
# in write mode. So a gate can regenerate an artifact, disagree with what is
# committed, and still exit 0 -- which is exactly how the web gate stayed red
# on `audit:tokens` from 45caae82 until 5854634c while nothing pointed at the
# cause. A checker cannot dirty the tree; only a writer can, so this catches
# the writers without having to remove them.
"gate:snapshot" = "bun scripts/gate-tree-guard.ts --snapshot"
"gate:clean" = "bun scripts/gate-tree-guard.ts --compare"

"ci:web" = [
  { task = "gate:snapshot" },
  { task = "audit:icons" },
  { task = "audit:tokens" },
  { task = "drift:recipes" },
  { task = "test:core" },
  { task = "test:components" },
  # The packaged counterpart of test:components. Cheap (~4s against ci:web's
  # ~21s) and it catches a class nothing else here can see: g13-b041 had a
  # component import its generated artifact from the preview package, which
  # every other gate accepted while the published tarball could not resolve it.
  { task = "test:web-pack-install" },
  { task = "svelte:surface-audit" },
  { task = "check:svelte" },
  { task = "docs:lint" },
  { task = "docs:react-specimen-drift" },
  { task = "docs:capability-drift" },
  # Conformance kernel (g14.001): read-only authority drift + web execution.
  { task = "conformance:serialize-check" },
  { task = "conformance:codegen-check" },
  { task = "conformance:test-web" },
  { task = "react:docs" },
  { task = "report:parity" },
  { task = "report:accessibility" },
  { task = "gate:clean" },
]
"ci:rust" = [{ task = "test:contracts" }]
"ci" = [
  { task = "ci:web" },
  { task = "ci:rust" },
]

# Native compile-rot check (macOS: gpui pulls metal). The preview is the only
# GPUI crate that needs a live window; since g12.019 the components themselves
# are `poodle-render` nodes, so their real coverage is CPU-only and runs here
# through `cargo test -p poodle-render` and the node backend's own tests.
# The pixel gate is `test:native-visual`, which does need a window and is
# LOCAL-ONLY; the scheduled workflow (ci-native.yml) checks gpui only.
"check:gpui" = [
  { run = "cargo check -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml" },
  { run = "cargo test -p poodle-render --manifest-path packages/render/Cargo.toml" },
  { run = "cargo test -p poodle-gpui-node-backend --manifest-path packages/gpui/node-backend/Cargo.toml" },
]
# `check:jetstream` and `test:jetstream` are gone: they drove
# `poodle-jetstream-components`, deleted in `ee704699` when Jetstream moved onto
# `poodle-render` nodes. The render probes they ran live in
# `cargo test -p poodle-render`, which `check:gpui` runs.
# The adapter crates cover theme/token resolution, layout mapping, and their
# direct manifest claims independently of the shared renderer.
"test:jetstream-adapter" = "cargo test -p poodle-jetstream --manifest-path packages/jetstream/adapter/Cargo.toml"
# Self-contained native board. This intentionally stops at Poodle-owned Rust,
# GPUI, and the in-repo Jetstream adapter; it must run from an ordinary Poodle
# worktree with no sibling engine checkout.
"ci:native" = [
  { task = "drift:handlers" },
  { task = "drift:events" },
  { task = "drift:adapter-manifests" },
  { task = "check:gpui" },
  { task = "gpui:test" },
  { task = "test:jetstream-adapter" },
]

# Paired-repository Jetstream admission board. The preview, accessibility
# projection, and role drift checks path-depend on the sibling Jetstream engine
# and therefore stay explicit rather than leaking into default QA.
"ci:jetstream" = [
  { task = "jetstream:build" },
  { task = "test:jetstream-a11y" },
  { task = "drift:roles" },
  # The conformance kernel's native leg (g14.001): executed GPUI evidence
  # on the standing local board — the board already runs macOS-only and
  # windowed gates (gpui:test, test:jetstream-a11y are display-free but
  # local; the runner opens a real window). Compile-only cannot catch an
  # inert listener, so the executed run sits here; the scheduled GitHub
  # workflow keeps the check-only mirror (no windowed CI runs by standing
  # decision — see the g14.001 batch log enforcement options).
  { task = "conformance:test-gpui" },
]
"qa:jetstream" = [
  { task = "ci:jetstream" },
  { task = "test:jetstream-visual" },
]

# Documentation
"docs:lint" = "bun run --cwd packages/svelte/preview docs:lint"
"docs:dev" = [{ task = "svelte:run" }]
"docs:build" = [{ task = "svelte:build" }]
"docs:check" = [
  { task = "gate:snapshot" },
  { task = "drift:recipes" },
  { task = "svelte:surface-audit" },
  { task = "docs:lint" },
  # Conformance kernel (g14.001): read-only authority drift + web execution.
  { task = "conformance:serialize-check" },
  { task = "conformance:codegen-check" },
  { task = "conformance:test-web" },
  { task = "react:docs" },
  { task = "report:parity" },
  { task = "report:accessibility" },
  { task = "docs:build" },
  { task = "gate:clean" },
]

# Legacy aliases for compatibility
"parity:check" = [{ task = "docs:check" }]
"parity:report" = [{ task = "report:parity" }]

# Cheap orientation for `effigy doctor`. Never alias health to the full board.
health = [{ task = "docs:lint" }]

# Full self-contained local release board (headless / CPU-only). Visual GPUI
# and paired Jetstream sweeps stay separate (`test:native-visual`,
# `qa:jetstream`). Was previously misnamed `health`, which made every
# `effigy doctor` run the whole suite.
qa = [
  { task = "ci" },
  { task = "ci:native" },
  { task = "test:web-pack-install" },
  { task = "audit:licenses" },
  { task = "audit:security" },
]
