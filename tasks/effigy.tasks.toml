[tasks]
# No root Cargo.toml on purpose: the crates are independent (the jetstream
# tree path-depends on the sibling engine repo), so Rust deps are fetched
# per manifest by the script rather than assuming a workspace at the root.
"bootstrap:deps" = [
  "bun install",
  "bun scripts/bootstrap-rust.ts",
]

# Token system
"tokens:build" = "bun packages/tokens/scripts/build-tokens.ts"
"icons:build" = "bun scripts/build-default-icons.ts"
"audit:icons" = "bun scripts/build-default-icons.ts --check"
# Generated token artifacts are committed so a clean clone packs a complete
# tarball with no build step. Committing generated source is only safe when
# something fails if the tree and the generator disagree -- this is that.
# `--check` also fails on committed files the generator no longer emits
# (the Svelte/core mirror already deleted those on write; check used not to).
"audit:tokens" = [
  { run = "bun packages/tokens/scripts/build-tokens.ts --check" },
  { run = "bun test packages/tokens/scripts/build-tokens.test.ts" },
]

# IR code generation (g13.003; the shell scene is g13.004 card 035). The
# generated TypeScript under packages/codegen/generated/ is committed for
# the same reason the token artifacts are: a clean clone packs everything.
# `ir:check` is the gate -- read-only, byte-exact, whitespace-classified,
# orphan-aware -- and `ir:build` is its write-mode twin. Like
# `tokens:build`, the write selector never composes into a gate (that
# composition is the 45caae82 failure); gates may only reach `*:check`.
#
# Card 035 R1: the shell scene is authored in Rust
# (packages/codegen/src/models/preview_shell.rs) and serialized to its own
# fixture by `--author-shell`; the emitter fixture (synthetic-model.json)
# is untouched. The shell-scene target renders that model into the
# consuming web packages' generated/ directories and its card-036 Rust
# sibling (shell-rust) into the native previews' generated/ directories
# (g13-b003 R1; card 036 R2); neither is part of the default target set,
# so a plain run over the synthetic fixture never writes into a consumer
# package. Component models were unwound in g13-053; only the shell scene
# remains. g14-b004 adds machine-interface targets (select-only, like the
# shell) from packages/contracts/headless/machine-interfaces.json into the
# core and headless generated/machines/ directories.
"ir:build" = [
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-shell packages/codegen/fixtures/shell-model.json" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-specimens packages/codegen/fixtures/specimens-model.json" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/synthetic-model.json --out packages/codegen/generated" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/svelte/preview/src --target shell-scene" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/react/preview/src --target shell-scene" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/gpui/preview/src --target shell-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/jetstream/preview/src --target shell-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/core/src --target machine-ts" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/contracts/headless/src --target machine-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/svelte/preview/src --target specimen-ts" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/react/preview/src --target specimen-ts" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/gpui/preview/src --target specimen-rust" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/jetstream/preview/src --target specimen-rust" },
]
"ir:check" = [
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-shell packages/codegen/fixtures/shell-model.json --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --author-specimens packages/codegen/fixtures/specimens-model.json --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/synthetic-model.json --out packages/codegen/generated --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/svelte/preview/src --target shell-scene --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/react/preview/src --target shell-scene --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/gpui/preview/src --target shell-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/shell-model.json --out packages/jetstream/preview/src --target shell-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/core/src --target machine-ts --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --machine-interfaces packages/contracts/headless/machine-interfaces.json --out packages/contracts/headless/src --target machine-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/svelte/preview/src --target specimen-ts --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/react/preview/src --target specimen-ts --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/gpui/preview/src --target specimen-rust --check" },
  { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- packages/codegen/fixtures/specimens-model.json --out packages/jetstream/preview/src --target specimen-rust --check" },
]

    "catalogue:build" = [
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/svelte/preview/src --target catalogue-ts" },
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/react/preview/src --target catalogue-ts" },
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/gpui/preview/src --target catalogue-rust" },
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/jetstream/preview/src --target catalogue-rust" },
    ]
    "catalogue:check" = [
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/svelte/preview/src --target catalogue-ts --check" },
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/react/preview/src --target catalogue-ts --check" },
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/gpui/preview/src --target catalogue-rust --check" },
      { run = "cargo run --quiet --manifest-path packages/codegen/Cargo.toml --bin poodle-codegen -- --catalogue packages/codegen/fixtures/preview-catalogue.json --out packages/jetstream/preview/src --target catalogue-rust --check" },
    ]

    # Focused native regression board (g14.021).
#
# The g14 executable-conformance pilot was REJECTED by g14.008: no portable
# interface authority, no shared case corpus, no normalized observation
# plane, no primitive certification, and no six-profile cross-runtime claim
# exists any more. What survived is the headless GPUI execution the pilot
# paid for, and the defects it caught now have owners beside the code they
# belong to (g14.021 experimental cleanup; see Git history).
#
# This board is exactly that residue: the small set of native regressions
# that only appear once a `poodle-node` tree is mounted in a real GPUI window
# and driven with real input. It proves nothing about Svelte, React, or
# cross-runtime parity — those live on `check:svelte`, `react:build`, and the
# component test boards.
# `{args}` forwards a test filter and harness flags, for example
# `effigy regressions:native my_test -- --exact`; without the placeholder the
# tokens are accepted and dropped, and the whole target runs.
# Per-test timeout is the harness `TEST_BOUND` in headless_driver.rs (libtest
# thread name). A stuck wait fails by name instead of wedging the run.
"regressions:native" = { run = "cargo test --quiet --manifest-path packages/gpui/preview/Cargo.toml --test headless_regressions {args}", env = { POODLE_NUCLEUS_RECEIPT_DIR = "{repo}/target/nucleus-receipts" } }
# Headless native specimen probe (g15.026): mounts the production GPUI
# `PreviewRoot` on the in-memory test platform and constructs all 174 portable
# catalogue routes at 768px, asserting each paints a real specimen card (never
# the fallback) and that every advertised Sizes/Densities tab opens its pane
# through real pointer input. Construction evidence only — no visual,
# interaction, or cross-runtime parity claim.
"probe:gpui-specimens" = "cargo test --quiet --manifest-path packages/gpui/preview/Cargo.toml --bin poodle-preview specimen_probe"
# g16.005 window capture smoke — HEADLESS. Builds the `poodle-window-capture`
# target, runs its own unit tests (the activation-boundary source check, the
# device-size policy, the frontmost-application rule, publish atomicity), and
# proves every negative invocation is rejected during argument validation,
# before any window exists. Opens no window, takes no focus, needs no Screen
# Recording permission. Safe in an ordinary worker; not in `qa`, because
# building the target is not cheap and it proves nothing about the web board.
"smoke:gpui-window-capture" = "bun packages/gpui/preview/scripts/window-capture-smoke.ts"
# The capture itself — WINDOWED, operator-approved only (AGENTS.md). Opens
# real GPUI windows with `focus: false`, captures each by its own window id,
# and asserts repeat byte-identity, receipt verification, and that the
# frontmost application never changed. Needs a macOS window server and Screen
# Recording permission. Never in qa, ci, or a release gate.
"capture:gpui-windowed" = "bun packages/gpui/preview/scripts/window-capture-diagnostic.ts"
# g16.005 inset-shadow evidence — WINDOWED, operator-approved only. The
# backend paints inset shadow layers itself (crates.io `BoxShadow` has no
# inset flag), and NOTHING else captures that path: the Button visual
# comparison's inventory is Button-only, and Button emits no shadow layers.
# Renders Accordion, ListCard, Tabs, and Popover — both band shapes, the
# stacked case, and the deferred overlay surface — in one non-activating
# process, and verifies each receipt's recorded bands against its PNG.
# Disposable output, no baseline, no comparison.
"capture:gpui-inset-shadows-windowed" = "bun packages/gpui/preview/scripts/inset-shadow-evidence.ts"
# Preview (documentation site)
"svelte:build" = "bun run --cwd packages/svelte/preview build"
# Low-level Vite only. Can start against stale ignored `packages/*/dist`.
"svelte:run" = "bun run --cwd packages/svelte/preview dev"
# Public selector: rebuild core + Svelte package, then Vite. Fail-closed.
"svelte:preview" = [{ task = "svelte:package" }, { task = "svelte:run"}]
"svelte:surface-audit" = "bun packages/svelte/components/scripts/surface-audit.ts"

# React preview (component gallery, mirrors the Svelte preview)
"react:build" = "bun run --cwd packages/react/preview build"
# Low-level Vite only. Can start against stale ignored `packages/*/dist`.
"react:run" = "bun run --cwd packages/react/preview dev"
# Public selector: rebuild core + React package, then Vite. Fail-closed.
"react:preview" = [{ task = "react:package" }, { task = "react:run" }]
"react:docs" = "bun run --cwd packages/react/preview docs:export"
"react:reports" = "bun run --cwd packages/react/preview reports"

# GPUI native preview (macOS)
"gpui:build" = "cargo build -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml"
"gpui:run" = "cargo run -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml --bin poodle-preview -- {args}"
"gpui:test" = "cargo test -p poodle-gpui --manifest-path packages/gpui/adapter/Cargo.toml"
"gpui:preview" = [{ task = "gpui:run" }]

# Jetstream native preview (game engine)
# Preflight names a missing or stale sibling checkout instead of cargo's
# unresolved path error. Poodle does not vendor Jetstream.
"jetstream:build" = "bun scripts/jetstream-build.ts"
"check:jetstream-preview" = "cargo check -p poodle-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:run" = "cargo run -p poodle-jetstream-preview --manifest-path packages/jetstream/preview/Cargo.toml"
"jetstream:test" = "cd packages/jetstream/adapter && cargo test"
"jetstream:preview" = [{ task = "jetstream:run" }]

# Reports
"report:parity" = [
  { task = "tokens:build" },
  { run = "bun run --cwd packages/svelte/preview parity:report" },
  { run = "bun run --cwd packages/react/preview parity:report" },
]
"report:accessibility" = [
  { run = "bun run --cwd packages/svelte/preview accessibility:report" },
  { run = "bun run --cwd packages/react/preview accessibility:report" },
]
"check:parity-evidence-ledger" = "bun scripts/parity-evidence-ledger.ts"
"test:parity-evidence-ledger" = "bun test --timeout 120000 scripts/parity-evidence-ledger.test.ts"
"update:parity-evidence-ledger" = "bun scripts/parity-evidence-ledger.ts --write"
"test:nucleus-parity-receipts" = "bun test scripts/nucleus-parity-receipts.test.ts"
"check:gpui-census" = "bun scripts/gpui-functionality-census.ts --check"
"test:gpui-census" = "bun test --timeout 120000 scripts/gpui-functionality-census.test.ts"
"update:gpui-census" = "bun scripts/gpui-functionality-census.ts {args}"

# CI gates — light, ubuntu-only. No native (gpui/jetstream) crates, no vite
# preview builds. The GitHub workflows bootstrap their pinned runtimes and
# Effigy before launching the named selectors. `effigy ci` is the local gate
# when dependencies are already installed. `effigy ci:fresh` is the
# from-nothing command Queue runs as pre-merge validation: frozen-lockfile
# install, then the same PR lanes, leaving only ignored outputs behind.
# g16.005 downstream consumer proof. Compiles a throwaway crate that pins
# `gpui-unofficial =1.22.0` for itself AND depends on Poodle's GPUI node
# backend, passing GPUI values across the boundary both ways. A different
# GPUI source or version in Poodle gives the crates different identities and
# this stops compiling. Includes a negative control. Headless; no window.
"drift:gpui-consumer-identity" = "bun test/consumer-dual-dependency/run.ts"
# g18.032 / spec 071: changed-range admission and archive certification are
# separate selectors. The npm certificate runs both and is the only web-release
# authority; aggregate `qa` stays independent.
"test:web-candidate" = "bun test test/package-install/web-candidate.test.ts scripts/verify-npm-candidate.test.ts"
"release:web-admission" = "bun test/package-install/web-admission.ts"
# One lockstep version path for the npm packages and every tagged Rust crate.
# The command refuses targets that do not increase the shared pre-1.0 version.
"release:bump" = [
  { run = "bun scripts/release-version.ts {args}" },
  { task = "ir:build" },
  { task = "catalogue:build" },
]
# Build a disposable GPUI downstream crate from a clean local bare tag of HEAD.
"release:gpui-consumer" = "bun scripts/gpui-consumer-smoke.ts"
# Certificate mode builds and packs exactly once and writes the candidate
# identity manifest into POODLE_WEB_PACK_INSTALL_ARCHIVE_OUT.
"release:web-archive" = {
  run = "bun test/package-install/web-preview.ts",
  env = { POODLE_WEB_PACK_INSTALL_ARCHIVE_CERTIFICATE = "1" },
}
"release:web-certificate" = [
  { task = "release:web-admission" },
  { task = "release:web-archive" },
]
# g18.032 validation runner. Bounded, observable, deduplicating board executor.
"test:validation-runner" = "bun test scripts/validation/run-board.test.ts scripts/validation/fresh.test.ts"
"check:release-automation" = "bun scripts/check-release-automation.ts"
# g18.027 public-surface freeze gate. Read-only cross-ref classifier plus its
# planted-negative coverage. Deliberately outside `qa`/`ci`: it needs the
# immutable `v0.3.0` tag and the frozen head in local history, and it is a
# release-ops gate rather than repository health. The accepted result is
# `docs/evidence/releases/g18-027-v040-public-surface-delta.md`; g18.006
# re-runs it against the candidate and requires no new breaking row.
"audit:public-surface" = [
  { run = "bun test scripts/audit-public-surface-delta.test.ts" },
  { run = "bun scripts/audit-public-surface-delta.ts --base v0.3.0 --head HEAD --summary" },
]
"core:build" = "bun scripts/web-distribution/core-build.ts"
"svelte:package" = [{ task = "core:build" }, { run = "bun scripts/web-distribution/svelte-build.ts" }]
"react:package" = [{ task = "core:build" }, { run = "bun scripts/web-distribution/react-build.ts" }]
# Rebuild every web package `dist` in one step. A `file:`-linked consumer
# resolves core, Svelte and React through their ignored `dist` exports; pulling
# a new commit leaves those trees stale and nothing in the pull path rebuilds
# them. `svelte:preview` / `react:preview` rebuild only what their own app needs.
"web:dist" = [
  { task = "svelte:package" },
  { task = "react:package" },
]
"test:core-build" = "bun test scripts/web-distribution/driver.test.ts scripts/web-distribution/staging.test.ts scripts/web-distribution/core-build.test.ts test/package-install/archive-membership.test.ts test/package-install/pack-archives.test.ts scripts/gate-tree-guard.test.ts scripts/docs-deps-preflight.test.ts scripts/workspace-lock.test.ts"
# g18.032: the installed-package scope suite plants dozens of git ranges and
# exceeds Bun's default per-test timeout when it shares a parallel test-file
# run with the core-build files. It is the same assertion inventory as its own
# board unit, so the contention cannot turn a correct range into a failure.
# Queue's ci:fresh gate runs it on a loaded host: one five-fixture case that
# takes ~6s alone hit 30s at ~4x slowdown (poodle#028, 2026-09-27), so the
# per-test cap is 120s. A genuine hang still fails well inside the 5-minute
# child bound.
"test:web-scope" = "bun test --timeout 120000 test/package-install/scope.test.ts test/package-install/web-preview-harness.test.ts test/package-install/consumer-lock.test.ts"
"test:release-version" = "bun test --timeout 120000 scripts/release-version.test.ts"
# Bootstrap the isolated TypeScript 6 declaration toolchain before Bun starts
# its parallel test-file workers; the helper still validates the exact nested
# realpath on every build.
"test:shell-build" = [
  { run = "bun install --frozen-lockfile --cwd scripts/web-distribution/declaration-tools" },
  { run = "bun test --timeout 120000 scripts/web-distribution/driver.test.ts scripts/web-distribution/svelte-build.test.ts scripts/web-distribution/react-build.test.ts scripts/web-distribution/shell-smoke.test.ts" },
]
# g18.015: public `*:preview` rebuilds package dist before Vite. Isolated
# stale/missing distributions, live HTTP module-graph proof, fail-closed
# startup, and process/port cleanup. Does not touch live ignored output.
"test:preview-preflight" = "bun test scripts/web-distribution/preview-distribution-preflight.test.ts test/visual/server.test.ts"
"test:core" = "bun run --cwd packages/core test"
# Focused shared-core behavior proof for the Listbox composite; keep worker
# validation narrow instead of running the full core unit suite.
"test:core-listbox" = "bun test --timeout 120000 packages/core/test/listbox.test.ts"
"test:core-icon-geometry-realize" = [
  { run = "bun test --timeout 120000 packages/core/test/icon-geometry-realize.test.ts" },
  { run = "bun test --timeout 120000 --test-name-pattern 'geometry realization support is exported for sibling test hosts' scripts/web-distribution/core-build.test.ts" },
]
# Component-shell smoke + interaction tests (Svelte + React) via vitest/happy-dom.
# Verifies the machine -> DOM wiring the framework packages add on top of the
# @inflatable-cookie/poodle-core machines (which test:core covers).
# Component tests use the ordinary Vitest heap and worker scheduling.
"test:components" = [
  { task = "core:build" },
  { run = "bunx vitest run" },
]
"test:web-pack-install" = "bun test/package-install/web-preview.ts"
"check:web-pack-install-roster" = "bunx tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --types node test/package-install/roster.ts"
# Compatibility selector for existing downstream handoffs and historical docs.
"test:svelte-pack-install" = [{ task = "test:web-pack-install" }]
"audit:security" = [
  { run = "bun scripts/audit-repository-security.ts" },
  { run = "bun audit" },
  { run = "cargo deny --manifest-path packages/render/Cargo.toml check advisories sources" },
  { run = "cargo deny --manifest-path packages/gpui/node-backend/Cargo.toml check advisories sources" },
  { run = "cargo deny --manifest-path packages/gpui/adapter/Cargo.toml check advisories sources" },
  { run = "cargo deny --manifest-path packages/jetstream/adapter/Cargo.toml check advisories sources" },
]
"test:repository-security" = "bun test scripts/audit-repository-security.test.ts"
"audit:licenses" = [
  { run = "bun scripts/audit-license-compliance.ts" },
  { run = "cargo deny --manifest-path packages/render/Cargo.toml check licenses" },
  { run = "cargo deny --manifest-path packages/gpui/node-backend/Cargo.toml check licenses" },
  { run = "cargo deny --manifest-path packages/gpui/adapter/Cargo.toml check licenses" },
  { run = "cargo deny --manifest-path packages/jetstream/adapter/Cargo.toml check licenses" },
]
# Svelte <-> React anatomy parity gate (subset of the vitest run above; also
# usable standalone). Diffs the poodle-* classes each implementation emits.
"test:parity" = "bunx vitest run --project parity"
# Runtime accessibility sweep (axe-core) over every Svelte component. Runs inside
# test:components already; A11Y_REPORT=1 lists findings instead of failing.
"test:a11y" = "bunx vitest run --project a11y"
# g16.111 Nucleus A1: Svelte half of the paired accessibility receipt. The
# mounted Svelte components resolve `poodle-core/styles/*.css` from the built
# core dist, so build it first; a fresh worker checkout has no
# `packages/core/dist` and the suite fails module resolution. Regenerate the
# committed Svelte snapshots with POODLE_NUCLEUS_A11Y_WRITE=1.
"test:nucleus-a11y" = [
  { task = "core:build" },
  { run = "bunx vitest run --project nucleus-a11y" },
]
# Cross-framework visual gate (g12.009): boots both vite previews and pixel-diffs
# the Svelte and React specimens at the same slug + axis. Needs a browser
# (`bunx playwright install chromium`) and two preview servers, so it stays out of
# ci:web — ci:visual is the gate, mirroring how ci:native handles the crates.
# Tiers: smoke (15 components, 1 axis), axis (15 x 12 size/density/contrast axes),
# sweep (every specimen slug x 2 themes).
