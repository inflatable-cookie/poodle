"ci:jetstream" = [
  { task = "jetstream:build" },
  { task = "test:jetstream-a11y" },
  { task = "drift:roles" },
]
"qa:jetstream" = [
  { task = "ci:jetstream" },
  { task = "test:jetstream-visual" },
]

