# The Jetstream sibling, and stronger: GPUI can only check that a handler field
# is read, because a real click there needs a live window. Jetstream dispatches
# clicks with no window, so this demands a test that actually drives one. Also
# `drift:clicks` is retired: it proved a real pointer gesture reached every
# Jetstream builder, but its subject — `poodle-jetstream-components` and its
# `click_probe` tests — was deleted in `ee704699` when Jetstream moved onto
# `poodle-render` nodes. The adapter that replaced it lives in the sibling
# jetstream repo, which is outside this repo's boundary, so the gate has
# nothing here to watch. GPUI's `drift:handlers` survives and now covers the
# shared `poodle-render` handlers both targets render, and `drift:events`
# recovers the half of its rule that was genuinely lost: a control that is
# rendered but that no host can reach.
# Pure contract crates only — each is a separate crate tree, all cross-platform
# (no gpui/game_ui deps). Native component crates are covered locally/nightly.
"test:contracts" = [
