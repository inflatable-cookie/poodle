  { run = "cargo test --manifest-path packages/contracts/node/Cargo.toml" },
]
# Listbox's Rust machine mirror has an isolated contract suite so native task
# validation does not need to run the unrelated contract crates above.
"test:headless-listbox" = "cargo test --quiet --manifest-path packages/contracts/headless/Cargo.toml listbox::tests"
"test:listbox-spec" = "cargo test --quiet --manifest-path packages/contracts/components/Cargo.toml listbox::tests"
# Fails if the working tree is dirty. Belongs at the END of any gate that
# runs a write-mode generator.
#
# `ci:web` and `docs:check` both do: `react:docs`, `report:parity` and
# `report:accessibility` are writers, and `report:parity` reaches `tokens:build`
# in write mode. So a gate can regenerate an artifact, disagree with what is
# committed, and still exit 0 -- which is exactly how the web gate stayed red
# on `audit:tokens` from 45caae82 until 5854634c while nothing pointed at the
# cause. A checker cannot dirty the tree; only a writer can, so this catches
# the writers without having to remove them.
"gate:snapshot" = "bun scripts/gate-tree-guard.ts --snapshot"
"gate:clean" = "bun scripts/gate-tree-guard.ts --compare"

"ci:web" = [
  { task = "gate:snapshot" },
  # g18.032: release-authority and candidate-admission laws run in required PR
  # CI, so a broken classifier or workflow drift fails the exact head.
  { task = "check:release-automation" },
  { task = "test:web-candidate" },
  { task = "test:validation-runner" },
  { task = "core:build" },
  { task = "audit:icons" },
  { task = "audit:tokens" },
  { task = "drift:recipes" },
  { task = "drift:drag-inventory" },
  { task = "drift:react-stylesheets" },
  { task = "test:core" },
  { task = "test:core-build" },
  { task = "test:web-scope" },
  # g16.098: detached worktree without shell dist. Bites if react-preview
  # loses its workspace alias or ci:web tests components before package builds.
  # Workspace node_modules are `cp -a`'d (not dir-symlinked) so relative
  # `@inflatable-cookie/*` links stay inside the checkout when the parent
  # already has `react:package` dist. 2026-09-28 loaded host (141/143/130):
  # checkout 2.9s, passing suites 15.5s, planted 6.3s. Vitest child 120s
  # (~8x); bun:test wrappers 120s. Process group kill on timeout.
  { run = "bun test scripts/web-distribution/cold-checkout-react-preview.test.ts" },
  # g18.015: preview selectors that skip package preflight serve a stale
  # core export graph. Bind composition and the live rebuild-before-listen
  # proof, not merely TOML text.
  { task = "test:preview-preflight" },
  # Export and docs audits inspect compiled shells. Build dist before
  # test:components so a cold checkout cannot resolve through missing exports.
  { task = "svelte:package" },
  { task = "react:package" },
  { task = "test:components" },
  # The packaged counterpart of test:components. Cheap (~4s against ci:web's
  # ~21s) and it catches a class nothing else here can see: g13-b041 had a
  # component import its generated artifact from the preview package, which
  # every other gate accepted while the published tarball could not resolve it.
  { task = "test:web-pack-install" },
  { task = "svelte:surface-audit" },
  { task = "check:core" },
  { task = "check:svelte" },
  # Both remaining type gates need the dist built above (svelte also via
  # install-smoke; react resolves poodle-core/poodle-react types from dist).
  { task = "check:react" },
  { task = "docs:lint" },
  { task = "check:parity-evidence-ledger" },
  # Cheap docs:check leaves that need no Rust. Stale GPUI census used to land
  # with every required gate green because check:gpui-census lived only on
  # docs:check. Same for Svelte/React prop-domain drift. Runtimes recorded
  # 2026-09-28 (this checkout): census 4.0s idle / 4.6s at load ~20;
  # react-prop-drift 0.25s idle / 0.31s loaded; value-domain-drift 0.20s idle
  # / 0.24s loaded.
  { task = "check:gpui-census" },
  { task = "docs:react-prop-drift" },
  { task = "docs:value-domain-drift" },
  { task = "docs:react-specimen-drift" },
  { task = "docs:capability-drift" },
  { task = "react:docs" },
  { task = "report:parity" },
  { task = "report:accessibility" },
  { task = "gate:clean" },
]
# Planted GENERATOR_VERSION restamp; ir:check is the committed-tree gate on ci:rust.
"test:codegen-stamp" = "cargo test --quiet --manifest-path packages/codegen/Cargo.toml --test emission check_detects_stale_generator_version_stamp -- --exact"
# poodle#072: the rustfmt gate over every Poodle Rust crate. `cargo fmt` cannot
# be the gate: there is no root workspace, and stable rustfmt has no per-path
# exclusion (`ignore` in rustfmt.toml is nightly-only), while rustfmt recurses
# into `#[path = "generated/…"]` child modules from every file it is passed —
# which would reformat generated Rust that must stay byte-identical to its
# generator (ir:check, catalogue:check, audit:tokens and audit:icons own that
# identity). The script enumerates each crate's authored `.rs` files and drives
# rustfmt with the crate's edition and `--config skip_children=true`; it
# probes `rustfmt --version` first and repairs a component-less toolchain via
# `rustup component add rustfmt` (the ubuntu ci:rust image ships 1.95 without
# the component), and only real `Diff in` output may produce the unformatted
# verdict — a diff-less exit 1 is an environment error, never a finding.
# `--self-test` proves the exclusion boundary, the recursion guard, the exit-
# status classification and a broken-toolchain run end to end on scratch
# crates. It is POSIX shell on purpose: the ubuntu ci:rust job
# ships sh, git and rustfmt and no Bun (a `bun:` selector there failed with
# exit 127), and workflow edits are out of scope. `--write` is the formatting
# twin: `sh scripts/check-rustfmt.sh --write` before committing.
# Generated-and-excluded: `generated/` directories (build-tokens.ts,
# poodle-codegen machine-rust / shell-rust / specimen-rust / catalogue-rust)
# and `*.generated.rs` (build-default-icons.ts).
# Runtime recorded 2026-09-30 (warm checkout, rustfmt 1.95 and 1.97 agree):
# ~3.8s wall for the check (17 crates, 867 files) and ~0.7s for the
# self-test; identical result under macOS sh and dash. First run on a
# component-less toolchain adds a one-time `rustup component add rustfmt`
# download.
"check:rustfmt" = [
  { run = "sh scripts/check-rustfmt.sh" },
  { run = "sh scripts/check-rustfmt.sh --self-test" },
]
# ir:check / catalogue:check need cargo; they stay off ci:web. A GENERATOR_VERSION
# restamp that is not regenerated used to pass every board Queue runs.
"ci:rust" = [
  { task = "test:contracts" },
  { task = "ir:check" },
  { task = "catalogue:check" },
  { task = "check:rustfmt" },
]
"ci" = [
  { task = "ci:web" },
  { task = "ci:rust" },
]
# Queue argv: ["effigy", "ci:fresh"]. scripts/validation/fresh.ts runs the
# frozen install and `effigy ci` with the Bun pinned in package.json
# `packageManager`, whatever Bun the host PATH provides. Hydration is JS only;
# cargo test fetches the contract crates. Do not compose bootstrap:deps (native
# crate fetch) or native/windowed/release selectors.
"ci:fresh" = "bun scripts/validation/fresh.ts"

# Native compile-rot check (macOS: gpui pulls metal). The preview is the only
# GPUI crate that needs a live window; since g12.019 the components themselves
# are `poodle-render` nodes, so their real coverage is CPU-only and runs here
# through `cargo test -p poodle-render` and the node backend's own tests.
# The bin unit tests join them so contract-doc drift in the native usage-docs
# surface cannot land with the board green.
# The pixel gate is `test:native-visual`, which does need a window and is
# LOCAL-ONLY; the scheduled workflow (ci-native.yml) checks gpui only.
"check:gpui" = [
  { run = "cargo check -p poodle-gpui-preview --manifest-path packages/gpui/preview/Cargo.toml" },
  { task = "test:gpui-preview" },
  { run = "cargo test -p poodle-render --manifest-path packages/render/Cargo.toml" },
  { run = "cargo test -p poodle-gpui-node-backend --manifest-path packages/gpui/node-backend/Cargo.toml" },
]
# The poodle-preview bin's unit tests, headless: the contract usage-docs
# loader (shared generated docs plus its contract-markdown fallback), the
# package receipt lock, app-state and file-pick logic, and the specimen-probe
# module. `probe:gpui-specimens` stays the probe's own ci:native member with
# its own g15.026 contract; this lane's rerun of the probe is the price of
# keeping every bin unit test on one selector instead of a filter list that
# new modules would silently escape. Runtime recorded 2026-09-30 (warm
# checkout): 8s wall, 1.6s of test time.
"test:gpui-preview" = "cargo test --quiet --manifest-path packages/gpui/preview/Cargo.toml --bin poodle-preview"
"test:jetstream-preview" = "cargo test --quiet --manifest-path packages/jetstream/preview/Cargo.toml --bin poodle-jetstream-preview"
# `check:jetstream` and `test:jetstream` are gone: they drove
# `poodle-jetstream-components`, deleted in `ee704699` when Jetstream moved onto
# `poodle-render` nodes. The render probes they ran live in
# `cargo test -p poodle-render`, which `check:gpui` runs.
# The adapter crates cover theme/token resolution, layout mapping, and their
# direct manifest claims independently of the shared renderer.
"test:jetstream-adapter" = "cargo test -p poodle-jetstream --manifest-path packages/jetstream/adapter/Cargo.toml"
# The native presentation cascade (architecture 010, g15.043): component specs
# keep size/density omission, public renderers take RenderContext rather than
# a bare ThemeProvider, and the GPUI preview never regains a passthrough or
# manual-equivalent UiPresentationProvider. Planted regressions of all three
# classes were proven caught.
"drift:presentation-cascade" = "bun scripts/check-presentation-cascade.ts"
# Self-contained native board. This intentionally stops at Poodle-owned Rust,
# GPUI, and the in-repo Jetstream adapter; it must run from an ordinary Poodle
# worktree with no sibling engine checkout.
"ci:native" = [
  { task = "drift:handlers" },
  { task = "drift:events" },
  { task = "drift:adapter-manifests" },
  { task = "drift:presentation-cascade" },
  { task = "check:gpui" },
  { task = "gpui:test" },
  { task = "test:jetstream-adapter" },
  # Focused native regressions on GPUI's in-memory test platform (g14.023,
  # retained by g14.021): no window, no focus, no OS activation.
  { task = "regressions:native" },
  # Native specimen construction probe (g15.026): same in-memory platform,
  # page tier rather than component tier.
  { task = "probe:gpui-specimens" },
  # The public GPUI source boundary (g16.005): an ordinary crates.io consumer
  # must still be able to depend on `gpui` and on Poodle's node backend at
  # once. Warm it is a few seconds; cold it builds GPUI once into a cached
  # target directory outside the checkout.
  { task = "drift:gpui-consumer-identity" },
  # The capture target's own headless surface: the activation boundary, the
  # device-size policy, and every rejected-before-a-window negative case.
  { task = "smoke:gpui-window-capture" },
]

# Paired-repository Jetstream admission board. The preview, accessibility
